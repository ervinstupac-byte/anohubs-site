<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expert Insights & Intelligence Hub | Anohubs</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter'], mono: ['JetBrains Mono'] },
                    colors: {
                        'h-blue': '#2563EB',
                        'h-cyan': '#06b6d4', 
                        'h-dark': '#0B1120', 
                        'h-cta': '#FFAA00',
                    },
                    animation: { 'fade-up': 'fadeUp 0.8s ease-out forwards' },
                    keyframes: {
                        fadeUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body { background-color: #0B1120; color: #f8fafc; overflow-x: hidden; }
        
        /* === FIXED BACKGROUND SYSTEM === */
        .fixed-bg {
            /* OVDJE JE TVOJA SLIKA */
            background-image: url('../assets/images/AnoHubs_VNM.jpg'); 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2;
            background-size: cover; background-position: center;
            filter: grayscale(30%); /* Malo desaturacije za ozbiljnost */
        }
        
        /* Tamni sloj da tekst bude čitljiv */
        .bg-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
            background: rgba(11, 17, 32, 0.85); 
            backdrop-filter: blur(5px);
        }

        /* HEADER */
        header { background-color: rgba(11, 17, 32, 0.9); border-bottom: 1px solid rgba(255,255,255,0.05); }

        /* TITLE */
        .intelligence-title {
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: clamp(3rem, 10vw, 6rem);
            font-weight: 900;
            letter-spacing: -0.05em;
            line-height: 1;
            text-shadow: 0 10px 30px rgba(56, 189, 248, 0.2);
        }

        /* FILTER BAR */
        .filter-bar {
            background-color: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 40px -5px rgba(0,0,0,0.5);
        }

        /* === KARTICE SA OSOBNOŠĆU === */
        .insight-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 1rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex; flex-direction: column; height: 100%;
            position: relative; overflow: hidden;
        }
        
        .insight-card:hover {
            transform: translateY(-8px);
            background: rgba(255, 255, 255, 0.07);
        }

        /* KATEGORIJE - BOJE */
        .border-manifesto { border-left: 6px solid #ef4444; }
        .border-strategy { border-left: 4px solid #3b82f6; }
        .border-finance { border-left: 4px solid #eab308; }
        .border-tech { border-left: 4px solid #06b6d4; }

        .search-input {
            background-color: rgba(0,0,0,0.3);
            color: white;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .search-input:focus { border-color: #38bdf8; outline: none; background-color: rgba(0,0,0,0.5); }
        
        .filter-btn { color: #94a3b8; transition: color 0.3s; }
        .filter-btn:hover { color: white; }
        .filter-btn.active { color: #38bdf8; font-weight: 700; text-shadow: 0 0 10px rgba(56,189,248,0.5); }
    </style>
</head>

<body class="antialiased">

    <div class="fixed-bg"></div>
    <div class="bg-overlay"></div>

    <header class="fixed w-full z-50 top-0 transition-all duration-300" id="navbar">
        <div class="max-w-7xl mx-auto px-6 h-24 flex justify-between items-center">
            <a href="../index.html" class="flex flex-col group">
                <span class="text-2xl font-black text-white tracking-tighter">ANOHUBS</span>
                <span class="text-[10px] font-mono text-h-cyan tracking-[0.2em] uppercase group-hover:text-white transition">Intelligence</span>
            </a>
            <nav class="hidden lg:flex items-center gap-10 text-xs font-bold uppercase tracking-widest text-slate-400">
                <a href="../index.html" class="hover:text-white transition">Home</a>
                <a href="../about-us-vision.html" class="hover:text-white transition">About</a>
                <a href="../services.html" class="hover:text-white transition">Services</a>
                <a href="#" class="text-h-cyan">Insights</a>
            </nav>
            <div class="hidden lg:flex items-center gap-6">
                <a href="../protocol.html" class="text-h-cyan font-bold text-xs tracking-widest uppercase border border-h-cyan/30 px-6 py-3 rounded-full hover:bg-h-cyan hover:text-black transition">Protocol</a>
                <a href="../contact.html" class="bg-h-cta hover:bg-yellow-400 text-black font-black text-xs uppercase tracking-widest px-8 py-3 rounded-full shadow-lg transition transform hover:scale-105">Contact</a>
            </div>
            <button class="lg:hidden text-white p-2"><i data-lucide="menu"></i></button>
        </div>
    </header>

    <main class="pt-32 pb-24">

        <section class="text-center px-4 py-16">
            <div class="inline-flex items-center gap-2 bg-white/5 border border-white/10 px-6 py-2 rounded-full mb-8 animate-fade-up backdrop-blur-md">
                <div class="w-2 h-2 bg-h-cyan rounded-full animate-pulse"></div>
                <span class="text-[10px] font-mono font-bold text-slate-300 uppercase tracking-widest">Knowledge Base: Online</span>
            </div>
            <h1 class="intelligence-title mb-6 animate-fade-up" style="animation-delay: 0.1s;">INTELLIGENCE</h1>
            <p class="text-slate-400 text-lg md:text-xl max-w-2xl mx-auto font-light animate-fade-up" style="animation-delay: 0.2s;">
                Forensic engineering insights, strategic forecasts, and the unvarnished truth about asset integrity.
            </p>
        </section>

        <section id="featured-container" class="max-w-6xl mx-auto px-4 mb-20 animate-fade-up" style="animation-delay: 0.25s;"></section>

        <section class="max-w-6xl mx-auto px-4 -mt-8 mb-16 relative z-20 animate-fade-up" style="animation-delay: 0.3s;">
            <div class="filter-bar rounded-2xl p-4 md:p-6 flex flex-col md:flex-row justify-between items-center gap-6">
                <div class="flex flex-wrap justify-center gap-6 md:gap-8 text-[10px] md:text-xs font-bold font-mono uppercase tracking-widest">
                    <button class="filter-btn active" onclick="filterInsights('all')">All Briefs</button>
                    <button class="filter-btn" onclick="filterInsights('tech')">Technical</button>
                    <button class="filter-btn" onclick="filterInsights('finance')">Financial</button>
                    <button class="filter-btn" onclick="filterInsights('strategy')">Strategic</button>
                </div>
                <div class="relative w-full md:w-72">
                    <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
                    <input type="text" id="search-input" placeholder="Search keywords..." class="search-input w-full text-xs rounded-full py-3 pl-10 pr-4 transition">
                </div>
            </div>
        </section>

        <section class="max-w-7xl mx-auto px-6">
            <div id="insights-grid" class="grid md:grid-cols-2 lg:grid-cols-3 gap-8">
                </div>
        </section>

    </main>

    <footer class="bg-black/50 text-white py-16 border-t border-white/10 backdrop-blur-lg">
        <div class="max-w-7xl mx-auto px-6 text-center">
            <p class="text-xs font-mono text-gray-500">© 2025 Anohubs Inc. | INTELLIGENCE DIVISION</p>
        </div>
    </footer>

    <script>
        lucide.createIcons();

        // === BAZA PODATAKA ===
        const insightsData = [
            {
                id: 17,
                tag: 'MANIFESTO',
                cat: 'strategy',
                title: 'THE CULTURAL BETRAYAL: Corporate Violence Against Assets',
                desc: 'Why the Low-Bid Policy is an act of corporate violence. A forensic breakdown of the 48% Risk and Zero-Tolerance Protocol.',
                date: 'DEC 11, 2025',
                link: 'article-17-cultural-betrayal.html',
                read: '12 MIN'
            },
            {
                id: 16,
                tag: 'LEADERSHIP',
                cat: 'strategy',
                title: 'The AI Paradox: Faster Tech, Harder Physics',
                desc: 'Why the accelerating pace of AI requires a return to unwavering engineering discipline.',
                date: 'DEC 05, 2025',
                link: 'article-16-ai-paradox.html',
                read: '4 MIN'
            },
            {
                id: 15,
                tag: 'GOVERNANCE',
                cat: 'strategy',
                title: 'Bridging the SCADA-CEO Gap',
                desc: 'Translating raw sensor data into executive-level decision intelligence.',
                date: 'MAY 25, 2025',
                link: 'article-15-scada-ceo-gap.html',
                read: '9 MIN'
            },
            {
                id: 14,
                tag: 'TECHNICAL',
                cat: 'tech',
                title: '3D Flow Analysis & CFD',
                desc: 'Using Computational Fluid Dynamics to visualize and correct turbulence within the draft tube.',
                date: 'JUN 10, 2025',
                link: 'article-14-3d-flow-analysis.html',
                read: '7 MIN'
            },
            {
                id: 13,
                tag: 'EROSION',
                cat: 'tech',
                title: 'Sediment & Silt Management',
                desc: 'Advanced coating and design strategies to combat abrasive wear in high-sediment rivers.',
                date: 'JUN 28, 2025',
                link: 'article-13-sediment-silt.html',
                read: '5 MIN'
            },
            {
                id: 12,
                tag: 'AUDIT',
                cat: 'tech',
                title: 'M-E Synergy Audit Explained',
                desc: 'Understanding the interplay between Mechanical vibration and Electrical discharge.',
                date: 'JUL 15, 2025',
                link: 'article-12-me-synergy-audit.html',
                read: '6 MIN'
            },
            {
                id: 11,
                tag: 'DIGITAL TWIN',
                cat: 'tech',
                title: 'Digital Twin Implementation',
                desc: 'How to successfully deploy a virtual replica of your plant for real-time stress testing.',
                date: 'JUL 30, 2025',
                link: 'article-11-digital-twin.html',
                read: '8 MIN'
            },
            {
                id: 10,
                tag: 'DIAGNOSTICS',
                cat: 'tech',
                title: 'The Hydro Check Engine Light',
                desc: 'Decoding the early warning signals your turbine is sending before critical failure.',
                date: 'AUG 14, 2025',
                link: 'article-10-check-engine-light.html',
                read: '4 MIN'
            },
            {
                id: 9,
                tag: 'STRATEGY',
                cat: 'strategy',
                title: 'A Holistic View of Hydro Assets',
                desc: 'Moving beyond component-level fixes to understand the entire hydraulic system as one organism.',
                date: 'AUG 28, 2025',
                link: 'article-9-holistic-view.html',
                read: '6 MIN'
            },
            {
                id: 8,
                tag: 'PHILOSOPHY',
                cat: 'strategy',
                title: 'The Symbiosis Standard',
                desc: 'Aligning mechanical integrity with ecological responsibility for sustainable hydro.',
                date: 'SEP 15, 2025',
                link: 'article-8-symbiosis-standard.html',
                read: '5 MIN'
            },
            {
                id: 7,
                tag: 'STRATEGY',
                cat: 'strategy',
                title: 'Fortress Maintenance',
                desc: 'Building a defensive maintenance perimeter that prevents cascading failures.',
                date: 'SEP 30, 2025',
                link: 'article-7-fortress-maintenance.html',
                read: '7 MIN'
            },
            {
                id: 6,
                tag: 'RISK',
                cat: 'finance',
                title: 'The Ticking Bomb of Aging Assets',
                desc: 'Strategies for extending the life of legacy turbines without total replacement.',
                date: 'OCT 12, 2025',
                link: 'article-6-ticking-bomb.html',
                read: '6 MIN'
            },
            {
                id: 5,
                tag: 'HUMAN FACTOR',
                cat: 'strategy',
                title: 'The Human Sensor',
                desc: 'Why experienced operators often detect faults before sensors, and how to digitize their intuition.',
                date: 'OCT 25, 2025',
                link: 'article-5-human-sensor.html',
                read: '5 MIN'
            },
            {
                id: 4,
                tag: 'LEADERSHIP',
                cat: 'strategy',
                title: 'DACH Region Leadership Insights',
                desc: 'Lessons learned from the high-precision standards of the German, Austrian, and Swiss hydro sectors.',
                date: 'NOV 10, 2025',
                link: 'article-4-dach-leadership.html',
                read: '8 MIN'
            },
            {
                id: 3,
                tag: 'TECHNICAL',
                cat: 'tech',
                title: 'Winter Operation Challenges',
                desc: 'Navigating the specific hydraulic and mechanical stresses of cold-weather hydro operation.',
                date: 'NOV 15, 2025',
                link: 'article-3-winter-challenges.html',
                read: '6 MIN'
            },
            {
                id: 2,
                tag: 'FINANCE',
                cat: 'finance',
                title: 'The Hidden Cost of the "Low Bid"',
                desc: 'A forensic breakdown of why the cheapest component often becomes the most expensive failure.',
                date: 'NOV 28, 2025',
                link: 'article-2-low-bid.html',
                read: '5 MIN'
            },
            {
                id: 1,
                tag: 'STRATEGY',
                cat: 'strategy',
                title: 'Engineering Immunity: The New Standard',
                desc: 'Why traditional maintenance fails and how the "Immunity" protocol neutralizes 48% of dynamic risks.',
                date: 'DEC 01, 2025',
                link: 'article-1-engineering-immunity.html',
                read: '7 MIN'
            }
        ];

        const grid = document.getElementById('insights-grid');
        const featuredContainer = document.getElementById('featured-container');
        const searchInput = document.getElementById('search-input');
        const filterBtns = document.querySelectorAll('.filter-btn');

        // 1. RENDER FEATURED (MANIFESTO) - Aggressive Red Style
        function renderFeatured() {
            const manifesto = insightsData.find(item => item.id === 17);
            if(manifesto) {
                featuredContainer.innerHTML = `
                    <a href="${manifesto.link}" class="block bg-gradient-to-br from-red-900/40 to-black/80 border border-red-500/50 rounded-2xl p-8 md:p-12 relative overflow-hidden group hover:border-red-500 transition-all duration-500 shadow-[0_0_50px_rgba(220,38,38,0.15)]">
                        <div class="absolute inset-0 bg-[url('../assets/images/Article 17/A17-pozadina1.jpg')] opacity-20 bg-cover mix-blend-overlay transition group-hover:opacity-30"></div>
                        <div class="absolute top-0 right-0 p-8 opacity-20 group-hover:opacity-100 transition transform group-hover:scale-110">
                            <i data-lucide="flame" class="w-40 h-40 text-red-500"></i>
                        </div>
                        <div class="relative z-10 max-w-3xl">
                            <div class="flex items-center gap-4 mb-6">
                                <span class="bg-red-600 text-white px-3 py-1 rounded text-[10px] font-black uppercase tracking-widest shadow-md animate-pulse">EDITOR'S CHOICE</span>
                                <span class="text-xs font-mono text-red-300 font-bold">MUST READ // ${manifesto.read}</span>
                            </div>
                            <h2 class="text-3xl md:text-5xl font-black text-white mb-6 leading-tight group-hover:text-red-400 transition">
                                ${manifesto.title}
                            </h2>
                            <p class="text-lg text-slate-300 mb-8 leading-relaxed font-medium">
                                ${manifesto.desc}
                            </p>
                            <div class="inline-flex items-center gap-3 text-sm font-bold text-red-500 uppercase tracking-widest group-hover:text-white transition-all border-b-2 border-red-600 pb-1">
                                Read The Manifesto <i data-lucide="arrow-right" class="w-5 h-5"></i>
                            </div>
                        </div>
                    </a>
                `;
            }
        }

        // 2. RENDER GRID (WITH PERSONALITY)
        function renderInsights(data) {
            grid.innerHTML = '';
            const gridData = data.filter(item => item.id !== 17);

            if (gridData.length === 0) {
                grid.innerHTML = '<div class="col-span-full text-center text-slate-500 py-10 font-mono">No briefs found.</div>';
                return;
            }

            gridData.forEach(item => {
                // == PERSONALITY LOGIC ==
                let borderClass = 'border-l-4 border-l-h-cyan'; // Default Tech
                let icon = 'cpu'; // Default icon
                let badgeColor = 'text-h-cyan border-h-cyan/30 bg-h-cyan/10';

                if(item.cat === 'finance') {
                    borderClass = 'border-l-4 border-l-yellow-500';
                    icon = 'trending-up';
                    badgeColor = 'text-yellow-500 border-yellow-500/30 bg-yellow-500/10';
                } else if(item.cat === 'strategy') {
                    borderClass = 'border-l-4 border-l-blue-500';
                    icon = 'target';
                    badgeColor = 'text-blue-500 border-blue-500/30 bg-blue-500/10';
                }

                const card = document.createElement('a');
                card.href = item.link;
                card.className = `insight-card p-8 group ${borderClass}`;
                
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-6">
                        <span class="px-3 py-1 rounded text-[10px] font-bold uppercase border ${badgeColor}">
                            ${item.tag}
                        </span>
                        <i data-lucide="${icon}" class="w-5 h-5 text-slate-500 group-hover:text-white transition"></i>
                    </div>
                    <h3 class="text-xl font-bold text-white mb-4 leading-tight group-hover:text-h-cyan transition">
                        ${item.title}
                    </h3>
                    <p class="text-sm text-slate-400 leading-relaxed mb-8 flex-grow">
                        ${item.desc}
                    </p>
                    <div class="pt-6 border-t border-white/5 flex items-center justify-between">
                        <span class="text-[10px] font-mono text-slate-500">${item.date}</span>
                        <div class="flex items-center gap-2 text-xs font-bold text-slate-300 uppercase tracking-widest group-hover:gap-4 transition-all">
                            Read <i data-lucide="arrow-right" class="w-4 h-4 text-h-cyan"></i>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
            lucide.createIcons();
        }

        function filterInsights(category) {
            filterBtns.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            if (category === 'all') {
                renderInsights(insightsData);
            } else {
                const filtered = insightsData.filter(item => item.cat === category);
                renderInsights(filtered);
            }
        }

        searchInput.addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = insightsData.filter(item => 
                item.title.toLowerCase().includes(term) || 
                item.desc.toLowerCase().includes(term) ||
                item.tag.toLowerCase().includes(term)
            );
            renderInsights(filtered);
        });

        // INIT
        renderFeatured();
        renderInsights(insightsData);
    </script>
</body>
</html>
