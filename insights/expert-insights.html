<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expert Insights & Intelligence Hub | Anohubs</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;900&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">

    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter'], mono: ['JetBrains Mono'] },
                    colors: {
                        'h-blue': '#2563EB',
                        'h-cyan': '#06b6d4',
                        'h-dark': '#0B1120',
                        'h-cta': '#FFAA00',
                    },
                    animation: { 'fade-up': 'fadeUp 0.8s ease-out forwards' },
                    keyframes: {
                        fadeUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #0B1120;
            color: #f8fafc;
            overflow-x: hidden;
        }

        /* === FIXED BACKGROUND SYSTEM === */
        .fixed-bg {
            /* OVDJE JE TVOJA SLIKA */
            background-image: url('../assets/images/AnoHubs_VNM.jpg');
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background-size: cover;
            background-position: center;
            filter: grayscale(30%);
            /* Malo desaturacije za ozbiljnost */
        }

        /* Tamni sloj da tekst bude čitljiv */
        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: rgba(11, 17, 32, 0.85);
            backdrop-filter: blur(5px);
        }

        /* HEADER */
        header {
            background-color: rgba(11, 17, 32, 0.9);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* TITLE */
        .intelligence-title {
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: clamp(3rem, 10vw, 6rem);
            font-weight: 900;
            letter-spacing: -0.05em;
            line-height: 1;
            text-shadow: 0 10px 30px rgba(56, 189, 248, 0.2);
        }

        /* FILTER BAR */
        .filter-bar {
            background-color: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 40px -5px rgba(0, 0, 0, 0.5);
        }

        /* === KARTICE SA OSOBNOŠĆU === */
        .insight-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 1rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        .insight-card:hover {
            transform: translateY(-8px);
            background: rgba(255, 255, 255, 0.07);
        }

        /* KATEGORIJE - BOJE */
        .border-manifesto {
            border-left: 6px solid #ef4444;
        }

        .border-strategy {
            border-left: 4px solid #3b82f6;
        }

        .border-finance {
            border-left: 4px solid #eab308;
        }

        .border-tech {
            border-left: 4px solid #06b6d4;
        }

        .search-input {
            background-color: rgba(0, 0, 0, 0.3);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .search-input:focus {
            border-color: #38bdf8;
            outline: none;
            background-color: rgba(0, 0, 0, 0.5);
        }

        .filter-btn {
            color: #94a3b8;
            transition: color 0.3s;
        }

        .filter-btn:hover {
            color: white;
        }

        .filter-btn.active {
            color: #38bdf8;
            font-weight: 700;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
        }
    </style>
</head>

<body class="antialiased">

    <div class="fixed-bg"></div>
    <div class="bg-overlay"></div>

        <div id="global-header"></div>

    <main class="pt-32 pb-24">

        <section class="text-center px-4 py-16">
            <div
                class="inline-flex items-center gap-2 bg-white/5 border border-white/10 px-6 py-2 rounded-full mb-8 animate-fade-up backdrop-blur-md">
                <div class="w-2 h-2 bg-h-cyan rounded-full animate-pulse"></div>
                <span class="text-[10px] font-mono font-bold text-slate-300 uppercase tracking-widest">Knowledge Base:
                    Online</span>
            </div>
            <h1 class="intelligence-title mb-6 animate-fade-up" style="animation-delay: 0.1s;">INTELLIGENCE</h1>
            <p class="text-slate-400 text-lg md:text-xl max-w-2xl mx-auto font-light animate-fade-up"
                style="animation-delay: 0.2s;">
                Forensic engineering insights, strategic forecasts, and the unvarnished truth about asset integrity.
            </p>
        </section>

        <section id="featured-container" class="max-w-6xl mx-auto px-4 mb-20 animate-fade-up"
            style="animation-delay: 0.25s;"></section>

        <section class="max-w-6xl mx-auto px-4 -mt-8 mb-16 relative z-20 animate-fade-up"
            style="animation-delay: 0.3s;">
            <div class="filter-bar rounded-2xl p-4 md:p-6 flex flex-col md:flex-row justify-between items-center gap-6">
                <div
                    class="flex flex-wrap justify-center gap-6 md:gap-8 text-[10px] md:text-xs font-bold font-mono uppercase tracking-widest">
                    <button class="filter-btn active" onclick="filterInsights('all')">All Briefs</button>
                    <button class="filter-btn" onclick="filterInsights('tech')">Technical</button>
                    <button class="filter-btn" onclick="filterInsights('finance')">Financial</button>
                    <button class="filter-btn" onclick="filterInsights('strategy')">Strategic</button>
                </div>
                <div class="relative w-full md:w-72">
                    <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
                    <input type="text" id="search-input" placeholder="Search keywords..."
                        class="search-input w-full text-xs rounded-full py-3 pl-10 pr-4 transition">
                </div>
            </div>
        </section>

        <section class="max-w-7xl mx-auto px-6">
            <div id="insights-grid" class="grid md:grid-cols-2 lg:grid-cols-3 gap-8">
            </div>
        </section>

    </main>

    <footer class="bg-black/50 text-white py-16 border-t border-white/10 backdrop-blur-lg">
        <div class="max-w-7xl mx-auto px-6 text-center">
            <p class="text-xs font-mono text-gray-500">© 2025 Anohubs Inc. | INTELLIGENCE DIVISION</p>
        </div>
    </footer>

    <script>
        lucide.createIcons();

        // === DATA LOADING ===
        let insightsData = [];

        async function loadInsightsData() {
            try {
                const response = await fetch('../assets/js/insights-data.json');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                insightsData = await response.json();

                // Initialize page after data loads
                renderFeatured();
                renderInsights(insightsData);
            } catch (error) {
                console.error('Failed to load insights data:', error);
                document.getElementById('insights-grid').innerHTML =
                    '<div class="col-span-full text-center text-red-500 py-10 font-mono">Failed to load articles. Please refresh the page.</div>';
            }
        }

        const grid = document.getElementById('insights-grid');
        const featuredContainer = document.getElementById('featured-container');
        const searchInput = document.getElementById('search-input');
        const filterBtns = document.querySelectorAll('.filter-btn');

        // 1. RENDER FEATURED (MANIFESTO) - Aggressive Red Style
        function renderFeatured() {
            const manifesto = insightsData.find(item => item.id === 17);
            if (manifesto) {
                const imageUrl = manifesto.image || '../assets/images/Article 17/A17-pozadina1.jpg';
                featuredContainer.innerHTML = `
                    <a href="${manifesto.link}" class="block bg-gradient-to-br from-red-900/40 to-black/80 border border-red-500/50 rounded-2xl p-8 md:p-12 relative overflow-hidden group hover:border-red-500 transition-all duration-500 shadow-[0_0_50px_rgba(220,38,38,0.15)]">
                        <div class="absolute inset-0 bg-[url('${imageUrl}')] opacity-20 bg-cover mix-blend-overlay transition group-hover:opacity-30"></div>
                        <div class="absolute top-0 right-0 p-8 opacity-20 group-hover:opacity-100 transition transform group-hover:scale-110">
                            <i data-lucide="flame" class="w-40 h-40 text-red-500"></i>
                        </div>
                        <div class="relative z-10 max-w-3xl">
                            <div class="flex items-center gap-4 mb-6">
                                <span class="bg-red-600 text-white px-3 py-1 rounded text-[10px] font-black uppercase tracking-widest shadow-md animate-pulse">EDITOR'S CHOICE</span>
                                <span class="text-xs font-mono text-red-300 font-bold">MUST READ // ${manifesto.readTime}</span>
                            </div>
                            <h2 class="text-3xl md:text-5xl font-black text-white mb-6 leading-tight group-hover:text-red-400 transition">
                                ${manifesto.title}
                            </h2>
                            <p class="text-lg text-slate-300 mb-8 leading-relaxed font-medium">
                                ${manifesto.description}
                            </p>
                            <div class="inline-flex items-center gap-3 text-sm font-bold text-red-500 uppercase tracking-widest group-hover:text-white transition-all border-b-2 border-red-600 pb-1">
                                Read The Manifesto <i data-lucide="arrow-right" class="w-5 h-5"></i>
                            </div>
                        </div>
                    </a>
                `;
                lucide.createIcons();
            }
        }

        // 2. RENDER GRID (WITH PERSONALITY)
        function renderInsights(data) {
            grid.innerHTML = '';
            const gridData = data.filter(item => item.id !== 17);

            if (gridData.length === 0) {
                grid.innerHTML = '<div class="col-span-full text-center text-slate-500 py-10 font-mono">No briefs found.</div>';
                return;
            }

            gridData.forEach(item => {
                // == PERSONALITY LOGIC ==
                let borderClass = 'border-l-4 border-l-h-cyan'; // Default Tech
                let icon = 'cpu'; // Default icon
                let badgeColor = 'text-h-cyan border-h-cyan/30 bg-h-cyan/10';

                if (item.category === 'finance') {
                    borderClass = 'border-l-4 border-l-yellow-500';
                    icon = 'trending-up';
                    badgeColor = 'text-yellow-500 border-yellow-500/30 bg-yellow-500/10';
                } else if (item.category === 'strategy') {
                    borderClass = 'border-l-4 border-l-blue-500';
                    icon = 'target';
                    badgeColor = 'text-blue-500 border-blue-500/30 bg-blue-500/10';
                }

                const card = document.createElement('a');
                card.href = item.link;
                card.className = `insight-card p-8 group ${borderClass}`;

                card.innerHTML = `
                    <div class="flex justify-between items-start mb-6">
                        <span class="px-3 py-1 rounded text-[10px] font-bold uppercase border ${badgeColor}">
                            ${item.tag}
                        </span>
                        <i data-lucide="${icon}" class="w-5 h-5 text-slate-500 group-hover:text-white transition"></i>
                    </div>
                    <h3 class="text-xl font-bold text-white mb-4 leading-tight group-hover:text-h-cyan transition">
                        ${item.title}
                    </h3>
                    <p class="text-sm text-slate-400 leading-relaxed mb-8 flex-grow">
                        ${item.description}
                    </p>
                    <div class="pt-6 border-t border-white/5 flex items-center justify-between">
                        <span class="text-[10px] font-mono text-slate-500">${item.date}</span>
                        <div class="flex items-center gap-2 text-xs font-bold text-slate-300 uppercase tracking-widest group-hover:gap-4 transition-all">
                            Read <i data-lucide="arrow-right" class="w-4 h-4 text-h-cyan"></i>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
            lucide.createIcons();
        }

        function filterInsights(category) {
            filterBtns.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            if (category === 'all') {
                renderInsights(insightsData);
            } else {
                const filtered = insightsData.filter(item => item.category === category);
                renderInsights(filtered);
            }
        }

        searchInput.addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = insightsData.filter(item =>
                item.title.toLowerCase().includes(term) ||
                item.description.toLowerCase().includes(term) ||
                item.tag.toLowerCase().includes(term)
            );
            renderInsights(filtered);
        });

        // INIT - Load data and render
        loadInsightsData();
    </script>

    <!-- Component Loader -->
    <script src="../assets/js/layout-loader.js"></script>
</body>

</html>
