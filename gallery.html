<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual Intelligence Archive | AnoHUB</title>
    <meta name="description" content="Secure archive of global hydro assets. Visual verification of structural integrity and NDT analysis.">
    
    <!-- 1. SCRIPTS & FONTS -->
    <script src="assets/js/head-init.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- 2. TAILWIND -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { 
                        sans: ['Inter', 'sans-serif'], 
                        mono: ['JetBrains Mono', 'monospace'] 
                    },
                    colors: {
                        'h-cyan': '#06b6d4', 
                        'h-green': '#10b981', 
                        'h-red': '#ef4444', 
                        'h-yellow': '#facc15', 
                        'h-dark': '#020617', 
                        'h-panel': '#0f172a', 
                        'h-border': '#1e293b',
                        'h-cta': '#f59e0b'
                    },
                    animation: {
                        'fade-in-up': 'fadeInUp 0.8s ease-out forwards',
                        'fade-in': 'fadeIn 0.3s ease-out forwards',
                    },
                    keyframes: {
                        fadeInUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body { background-color: #020617; color: #f8fafc; overflow-x: hidden; }
        
        /* Tech Grid Background */
        .tech-bg {
            background-image: 
                linear-gradient(rgba(6, 182, 212, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(6, 182, 212, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
        }

        /* Lightbox Styles */
        .lightbox-modal { background-color: rgba(2, 6, 23, 0.98); backdrop-filter: blur(10px); }
        
        /* Navigation Arrows */
        .nav-arrow {
            position: absolute; top: 50%; transform: translateY(-50%);
            background: rgba(0,0,0,0.5); color: white; border: 1px solid #334155;
            padding: 10px; border-radius: 50%; cursor: pointer; z-index: 60;
            transition: all 0.2s;
        }
        .nav-arrow:hover { background: #06b6d4; color: black; border-color: #06b6d4; }
        #prev-btn { left: 20px; }
        #next-btn { right: 20px; }

        /* Controls Bar */
        .lightbox-controls-bar {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.9); border: 1px solid #334155;
            padding: 10px 20px; border-radius: 30px;
            display: flex; gap: 20px; align-items: center; z-index: 60;
        }

        /* Hidden Controls State */
        .controls-hidden .lightbox-controls-bar, 
        .controls-hidden .nav-arrow { 
            opacity: 0; pointer-events: none; transition: opacity 0.5s; 
        }
        
        /* Thumbnail Hover Effect */
        .thumbnail-item:hover .thumbnail-overlay { opacity: 1; }
    </style>
    <link rel="stylesheet" href="assets/css/preloader.css">
</head>

<body class="antialiased">
    <div class="tech-bg"></div>

    <!-- NAV -->
        <div id="global-header"></div>

    <main class="pt-32 pb-20">

        <!-- HERO -->
        <section class="max-w-7xl mx-auto px-4 mb-12 text-center">
            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full border border-white/10 bg-white/5 text-xs font-mono text-slate-400 mb-6 animate-[fadeInUp_1s_ease-out]">
                <svg data-lucide="database" class="w-3 h-3 text-h-cyan"></svg>
                DATABASE STATUS: ONLINE
            </div>
            <h1 class="text-5xl md:text-7xl font-black text-white mb-6 tracking-tight leading-none animate-[fadeInUp_1s_ease-out_0.2s_forwards] opacity-0">
                VISUAL <br>
                <span class="text-transparent bg-clip-text bg-gradient-to-r from-h-cyan to-blue-500">INTELLIGENCE</span>
            </h1>
            <p class="text-xl text-slate-400 max-w-2xl mx-auto leading-relaxed mb-8 animate-[fadeInUp_1s_ease-out_0.4s_forwards] opacity-0">
                Secured archive containing <span class="text-white font-bold total-images-placeholder">...</span> verified assets. 
                High-resolution NDT scans and site recon data.
            </p>
            
            <!-- Start Button -->
            <div class="animate-[fadeInUp_1s_ease-out_0.6s_forwards] opacity-0">
                 <button onclick="openModal(0); toggleSlideshow(document.getElementById('slideshow-btn'))" 
                        class="inline-flex items-center px-8 py-3 bg-h-green text-black font-bold rounded-full hover:bg-green-400 transition shadow-[0_0_20px_rgba(16,185,129,0.3)] uppercase tracking-widest text-sm">
                    <svg data-lucide="play" class="w-4 h-4 mr-2"></svg> Start Full Experience
                 </button>
            </div>
        </section>

        <!-- GALLERY GRID CONTAINER -->
        <section class="max-w-7xl mx-auto px-4 min-h-[60vh]">
            
            <!-- 
                VAŽNO: Klasa 'gallery-grid' je ono što JS traži da bi ubacio slike.
                Vaša skripta 'js/gallery-logic.js' će automatski generirati HTML unutar ovog div-a.
            -->
            <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4 gallery-grid pb-20">
                <div class="col-span-full text-center py-20 text-slate-500 font-mono animate-pulse">
                    INITIALIZING SECURE FEED...
                </div>
            </div>

        </section>

    </main>

    <!-- LIGHTBOX MODAL (Skriven po defaultu) -->
    <div id="lightbox-modal" class="lightbox-modal hidden fixed inset-0 z-[100] flex items-center justify-center">
        <div id="lightbox-window" class="w-full h-full flex flex-col justify-center items-center relative">
            
            <!-- Image Container -->
            <div id="lightbox-image-wrapper" class="relative flex justify-center items-center w-full h-full p-4 md:p-10">
                <!-- JS ubacuje <img> ovdje -->
            </div>
            
            <!-- Controls -->
            <button id="prev-btn" class="nav-arrow" onclick="navigateGallery(-1)" aria-label="Previous Image">
                <svg data-lucide="chevron-left" class="w-8 h-8"></svg>
            </button>
            <button id="next-btn" class="nav-arrow" onclick="navigateGallery(1)" aria-label="Next Image">
                <svg data-lucide="chevron-right" class="w-8 h-8"></svg>
            </button>

            <div class="lightbox-controls-bar">
                <div class="text-slate-300 font-mono text-xs mr-4" id="lightbox-counter">00 / 00</div>
                
                <button onclick="toggleFullScreen()" class="hover:text-h-cyan transition" title="Toggle Fullscreen">
                    <svg data-lucide="maximize" class="w-5 h-5"></svg>
                </button>
                
                <button onclick="toggleSlideshow(this)" id="slideshow-btn" class="flex items-center gap-2 bg-h-green text-black px-4 py-1.5 rounded-full font-bold text-[10px] uppercase hover:bg-green-400 transition min-w-[120px] justify-center">
                    <span>▶️ Start</span>
                </button>
                
                <button onclick="closeModal()" class="hover:text-h-red transition ml-4" title="Close Gallery">
                    <svg data-lucide="x" class="w-6 h-6"></svg>
                </button>
            </div>
        </div>
    </div>

        <div id="global-footer"></div>

    <!-- SCRIPTS -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <script src="assets/js/ui_core.js"></script>
    <script src="assets/js/animation_logic.js"></script>
    
    <!-- OBAVEZNO: Uključivanje vaše logike galerije -->
    <script src="assets/js/gallery-logic.js"></script>
    
    <!-- OBAVEZNO: Zaštita sadržaja -->
    <script src="assets/js/gallery-protection.js"></script>

    <script>
        lucide.createIcons();
        
        // Mobile Menu Logic (Za svaki slučaj ako ui_core ne učita)
        const menuBtn = document.getElementById('mobile-menu-btn');
        const mobileMenu = document.getElementById('mobile-menu');
        if(menuBtn) {
            menuBtn.addEventListener('click', () => {
                mobileMenu.classList.toggle('hidden');
            });
        }

        // Navbar Scroll Effect
        window.addEventListener('scroll', () => {
            const nav = document.getElementById('navbar');
            if (window.scrollY > 50) {
                nav.classList.add('shadow-lg', 'bg-h-dark/95');
                nav.classList.remove('bg-h-dark/90');
            } else {
                nav.classList.remove('shadow-lg', 'bg-h-dark/95');
                nav.classList.add('bg-h-dark/90');
            }
        });
    </script>

    <!-- Component Loader -->
    <script src="assets/js/layout-loader.js"></script>
</body>
</html>
