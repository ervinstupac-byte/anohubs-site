<html lang="bs">

    <style>
        /* Osigurava da iFrame pokriva 100% prozora */

<body>

        <div style="border: 1px solid #ef4444; padding: 20px;">
            <h1 style="color: #ef4444; font-size: 24px; margin-bottom: 10px;">SYSTEM ERROR: SCRIPT BLOCKED</h1>

    <iframe 
        id="anohub-iframe"
