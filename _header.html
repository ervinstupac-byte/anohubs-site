<!-- JS za Header (ako nije u ui_core.js) -->
<script>
    const mobileBtn = document.getElementById('mobile-menu-btn');
    const mobileMenu = document.getElementById('mobile-menu');

    if (mobileBtn && mobileMenu) {
        mobileBtn.addEventListener('click', () => {
            mobileMenu.classList.toggle('hidden');
            // Optional: Animate Icon change
        });
    }

    // Scroll Effect
    window.addEventListener('scroll', () => {
        const nav = document.getElementById('navbar');
        if (window.scrollY > 20) {
            nav.classList.add('shadow-xl', 'bg-[#020617]/95');
            nav.classList.remove('bg-[#020617]/90');
        } else {
            nav.classList.remove('shadow-xl', 'bg-[#020617]/95');
            nav.classList.add('bg-[#020617]/90');
        }
    });
</script>
