<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANO_HUB // TERMINAL_ACCESS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { 'h-gold': '#FFB800', 'h-cyan': '#06b6d4', 'h-red': '#ef4444' } } } }
    </script>
    <style>
        body {
            font-family: 'Courier New', monospace;
        }
    </style>
</head>

<body class="bg-black text-green-500 p-6 min-h-screen">
    <div class="max-w-4xl mx-auto space-y-12">

        <div class="border-b border-green-800 pb-4 flex justify-between items-end">
            <h1 class="text-2xl font-bold">/// ADMIN_TERMINAL_V1</h1>
            <div class="text-xs opacity-50">SECURE_CONNECTION: ACTIVE</div>
        </div>

        <div class="bg-green-900/10 p-6 border border-green-800/50">
            <h2 class="text-h-gold mb-4 text-xl">>> GRID_CONTROLLER</h2>
            <div class="flex gap-4 items-center">
                <input id="freq-input" type="number" step="0.01" value="50.00"
                    class="bg-black border border-green-700 p-2 text-xl w-32 focus:outline-none focus:border-h-gold text-white">
                <button id="btn-sync"
                    class="bg-green-700 hover:bg-green-600 text-black font-bold px-6 py-2 uppercase tracking-widest">
                    SYNC_NETWORK
                </button>
            </div>
            <p id="grid-status" class="mt-2 text-xs opacity-60">CURRENT: FETCHING...</p>
        </div>

        <div class="bg-green-900/10 p-6 border border-green-800/50">
            <h2 class="text-h-gold mb-4 text-xl">>> LOG_NEW_MISSION</h2>
            <form id="mission-form" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <input type="text" id="m-id" placeholder="CASE ID (e.g. 013)"
                    class="bg-black border border-green-700 p-2 text-sm text-white">
                <select id="m-type" class="bg-black border border-green-700 p-2 text-sm text-white">
                    <option value="FRANCIS">FRANCIS</option>
                    <option value="KAPLAN">KAPLAN</option>
                    <option value="PELTON">PELTON</option>
                    <option value="FINANCE">FINANCE</option>
                </select>
                <input type="text" id="m-title" placeholder="TITLE (e.g. Vibration Fix)"
                    class="bg-black border border-green-700 p-2 text-sm text-white col-span-2">
                <input type="text" id="m-threat" placeholder="THREAT"
                    class="bg-black border border-green-700 p-2 text-sm text-white">
                <input type="text" id="m-result" placeholder="RESULT"
                    class="bg-black border border-green-700 p-2 text-sm text-white">
                <button type="submit"
                    class="col-span-2 bg-h-gold hover:bg-white text-black font-bold py-2 uppercase">UPLOAD_TO_ARCHIVE</button>
            </form>
        </div>

        <div class="bg-green-900/10 p-6 border border-green-800/50">
            <h2 class="text-h-gold mb-4 text-xl">>> INCOMING_TRANSMISSIONS</h2>
            <div id="inbox-list" class="space-y-2 text-xs h-64 overflow-y-auto pr-2">
                <div class="animate-pulse">SCANNING...</div>
            </div>
        </div>
    </div>

    <script type="module">
        import { supabase } from './assets/js/db.js';
        // --- 1. GRID LOGIC ---
        const freqInput = document.getElementById('freq-input');
        const btnSync = document.getElementById('btn-sync');
        const gridStatus = document.getElementById('grid-status');
        async function loadGrid() {
            const { data } = await supabase.from('system_status').select('*').eq('id', 'main_grid').single();
            if (data) {
                freqInput.value = data.frequency;
                gridStatus.innerText = `CURRENT_DB_VAL: ${data.frequency} Hz`;
            }
        }

        btnSync.addEventListener('click', async () => {
            btnSync.innerText = 'SYNCING...';
            const val = parseFloat(freqInput.value);
            const { error } = await supabase.from('system_status').update({ frequency: val }).eq('id', 'main_grid');

            if (!error) {
                btnSync.innerText = 'SYNC_COMPLETE';
                gridStatus.innerText = `UPDATED: ${val} Hz`;
                setTimeout(() => btnSync.innerText = 'SYNC_NETWORK', 2000);
            } else {
                alert('ERROR: ' + error.message);
            }
        });
        // --- 2. MISSION LOGIC ---
        document.getElementById('mission-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const { error } = await supabase.from('missions').insert([{
                case_id: document.getElementById('m-id').value,
                turbine_type: document.getElementById('m-type').value,
                title: document.getElementById('m-title').value,
                threat: document.getElementById('m-threat').value,
                result: document.getElementById('m-result').value
            }]);

            if (!error) {
                alert('MISSION LOGGED SUCCESSFULLY');
                e.target.reset();
            } else {
                alert('WRITE ERROR: ' + error.message);
            }
        });
        // --- 3. INBOX LOGIC ---
        async function loadInbox() {
            const { data, error } = await supabase.from('inquiries').select('*').order('created_at', { ascending: false }).limit(10);
            const list = document.getElementById('inbox-list');
            list.innerHTML = '';

            if (data) {
                data.forEach(msg => {
                    list.innerHTML += `
                    <div class="border-b border-green-800/30 pb-2 mb-2">
                        <span class="text-white font-bold">[${new Date(msg.created_at).toLocaleDateString()}]</span> 
                        <span class="text-h-gold">${msg.full_name}</span> (${msg.company}): 
                        <span class="text-slate-400">"${msg.message}"</span>
                        <div class="text-[10px] text-green-700">${msg.email} | ${msg.phone}</div>
                    </div>
                `;
                });
            }
        }
        // INIT
        loadGrid();
        loadInbox();
    </script>
</body>

</html>
