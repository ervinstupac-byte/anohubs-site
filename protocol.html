<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnoHUB | TITAN PROTOCOL v35.0</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=JetBrains+Mono:wght@300;500;800&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { 
            theme: { 
                extend: { 
                    fontFamily: { 
                        sans: ['Rajdhani', 'sans-serif'], 
                        mono: ['JetBrains Mono', 'monospace'],
                        divine: ['Cinzel', 'serif'] 
                    },
                    colors: { 
                        'h-gold': '#FFD700', 'h-void': '#030303', 
                        'm-cyan': '#06b6d4', 'm-purple': '#8b5cf6', 'm-orange': '#f97316', 'm-yellow': '#facc15',
                        'm-blue': '#3b82f6', 'm-green': '#10b981', 'm-red': '#ef4444', 'm-magma': '#ff5722',
                        'm-stone': '#78716c', 'm-emerald': '#34d399', 'm-fuchsia': '#d946ef'
                    },
                    animation: { 
                        'spin-orbit': 'spin 120s linear infinite', 
                        'pulse-glow': 'pulseGlow 4s infinite' 
                    },
                    keyframes: {
                        pulseGlow: { '0%, 100%': { boxShadow: '0 0 30px rgba(255, 215, 0, 0.2)' }, '50%': { boxShadow: '0 0 80px rgba(255, 215, 0, 0.6)' } }
                    }
                } 
            }
        }
    </script>

    <style>
        body { background-color: #000; color: #e2e8f0; overflow-x: hidden; cursor: crosshair; }
        
        /* BACKGROUND LAYERS */
        .matrix-canvas { position: fixed; inset: 0; z-index: -2; opacity: 0.2; pointer-events: none; mix-blend-mode: screen; }
        
        .holy-grid {
            position: fixed; inset: 0; z-index: -1;
            background-image: linear-gradient(rgba(255, 215, 0, 0.04) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255, 215, 0, 0.04) 1px, transparent 1px);
            background-size: 80px 80px;
            mask-image: radial-gradient(circle at 50% 50%, black 10%, transparent 100%);
            pointer-events: none;
        }

        /* 3D ENGINE */
        .universe-container {
            height: 95vh; width: 100%;
            display: flex; align-items: center; justify-content: center;
            perspective: 1500px; position: relative; z-index: 10;
            overflow: hidden;
        }

        #galaxy {
            position: relative; width: 0; height: 0;
            transform-style: preserve-3d;
            animation: spin-orbit 90s linear infinite;
            pointer-events: none; /* Don't block clicks */
        }
        
        /* Pause on hover for easier clicking */
        .universe-container:hover #galaxy { animation-play-state: paused; }

        .orbit-ring {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 50%; transform-style: preserve-3d;
            pointer-events: none;
        }

        /* PLANET LINK (Robust Hit Area) */
        .planet-link {
            position: absolute; top: 50%; left: 50%;
            width: 80px; height: 80px; margin-left: -40px; margin-top: -40px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transform-style: preserve-3d; cursor: pointer; text-decoration: none;
            pointer-events: auto !important; z-index: 100;
        }

        /* Counter-rotate to keep text readable */
        .planet-content {
            animation: spin-orbit 90s linear infinite reverse; /* Cancels galaxy rotation */
            text-align: center; transition: all 0.3s ease;
            display: flex; flex-direction: column; align-items: center;
        }
        .universe-container:hover .planet-content { animation-play-state: paused; }

        .planet-core {
            width: 12px; height: 12px; background: #000; border: 2px solid; border-radius: 50%;
            box-shadow: 0 0 15px currentColor; transition: all 0.3s;
        }

        .planet-label {
            margin-top: 8px; font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: bold;
            color: rgba(255,255,255,0.7); background: rgba(0,0,0,0.9); padding: 3px 8px; border-radius: 4px;
            border: 1px solid #333; white-space: nowrap; transition: all 0.3s;
        }

        .planet-link:hover { z-index: 1000; }
        .planet-link:hover .planet-core { transform: scale(2.5); background: white; border-color: white !important; box-shadow: 0 0 50px white; }
        .planet-link:hover .planet-label { color: #FFD700; border-color: #FFD700; transform: scale(1.2); opacity: 1; }

        /* SUN */
        .sun {
            position: absolute; width: 140px; height: 140px;
            background: radial-gradient(circle, #fff 5%, #FFD700 70%, #000 100%);
            border-radius: 50%; transform: translate(-50%, -50%);
            box-shadow: 0 0 150px rgba(255, 215, 0, 0.5);
            display: flex; align-items: center; justify-content: center;
            font-family: 'Cinzel', serif; font-weight: 900; color: black; font-size: 48px;
            pointer-events: none; z-index: 10;
        }

        /* MODULE CARDS */
        .module-card {
            background: linear-gradient(180deg, rgba(15,15,15,0.95) 0%, rgba(5,5,5,1) 100%);
            border: 1px solid rgba(255,255,255,0.1); transition: all 0.3s ease;
        }
        .module-card:hover { transform: translateY(-5px); border-color: var(--hover-color); box-shadow: 0 0 40px var(--hover-glow); }
        
        /* SCROLLBAR */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; border: 1px solid #000; }
        ::-webkit-scrollbar-thumb:hover { background: #FFD700; }
    </style>
</head>
<body>

    <canvas id="matrix-bg" class="matrix-canvas"></canvas>
    <div class="holy-grid"></div>

    <div class="fixed top-0 left-0 w-full z-50 p-6 flex justify-between items-start bg-gradient-to-b from-black to-transparent pointer-events-none">
        <div class="pointer-events-auto">
            <a href="index.html" class="group block">
                <h1 class="text-5xl font-divine text-white tracking-[0.2em] drop-shadow-lg group-hover:text-h-gold transition">AnoHUB</h1>
                <div class="h-0.5 w-16 bg-h-gold mt-2 group-hover:w-32 transition-all duration-500"></div>
                <p class="text-[10px] font-mono text-h-gold mt-1">TITAN PROTOCOL v35.0</p>
            </a>
        </div>
        <div class="text-right hidden md:block pointer-events-auto">
            <div class="text-[10px] font-mono text-slate-400">SYSTEM STATUS</div>
            <div class="text-xl font-divine text-h-green animate-pulse">OPTIMAL</div>
        </div>
    </div>

    <div class="universe-container">
        <div id="galaxy">
            <div class="sun animate-pulse-glow">A</div>

            <div class="orbit-ring w-[350px] h-[350px]" style="transform: translate(-50%, -50%) rotateX(90deg);"></div>
            <div class="orbit-ring w-[550px] h-[550px]" style="transform: translate(-50%, -50%) rotateX(90deg);"></div>
            <div class="orbit-ring w-[850px] h-[850px]" style="transform: translate(-50%, -50%) rotateX(90deg);"></div>
            
            </div>

        <div class="absolute bottom-8 text-center w-full animate-bounce pointer-events-auto cursor-pointer" onclick="document.getElementById('full-matrix').scrollIntoView({behavior: 'smooth'})">
            <p class="text-[10px] font-mono text-h-gold mb-2 tracking-[0.3em]">ACCESS FULL MATRIX</p>
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#FFD700" stroke-width="2" class="mx-auto"><path d="m7 13 5 5 5-5"/><path d="m7 6 5 5 5-5"/></svg>
        </div>
    </div>

    <section id="full-matrix" class="relative z-10 bg-black border-t border-h-gold/30 py-24 px-8 min-h-screen">
        <div class="max-w-7xl mx-auto">
            <div class="flex items-center gap-4 mb-16">
                <div class="w-3 h-12 bg-h-gold shadow-[0_0_30px_#FFD700]"></div>
                <div>
                    <h2 class="text-4xl font-divine text-white tracking-[0.15em]">PROTOCOL INDEX</h2>
                    <p class="text-xs font-mono text-slate-500">22 ACTIVE MODULES</p>
                </div>
            </div>
            <div id="modules-grid" class="grid md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8"></div>
        </div>
    </section>

    <div id="ai-takeover" class="fixed inset-0 z-[9999] bg-black hidden flex-col items-center justify-center">
        <canvas id="matrix-overlay" class="absolute inset-0 w-full h-full"></canvas>
        <div class="absolute inset-0 flex flex-col items-center justify-center z-20 pointer-events-none">
            <div id="ai-box" class="bg-black/95 border-2 border-h-gold p-16 text-center backdrop-blur-xl shadow-[0_0_200px_rgba(255,215,0,0.4)] transform scale-0 transition-transform duration-500">
                <h1 class="text-7xl font-black text-white tracking-tighter mb-4 font-divine">OMNISCIENCE</h1>
                <div class="text-h-gold font-mono text-xl animate-pulse">ESTABLISHING NEURAL HANDSHAKE...</div>
                <div class="w-full h-2 bg-slate-800 mt-8 rounded overflow-hidden"><div id="ai-bar" class="h-full bg-h-gold w-0 transition-all duration-300 ease-out"></div></div>
                <div id="ai-log" class="mt-8 font-mono text-xs text-slate-400 h-32 overflow-hidden text-left space-y-2 border-t border-slate-800 pt-4"></div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <script>
        const App = {
            // === THE DEFINITIVE LIST OF 22 MODULES ===
            // Verified against your screenshot: "protocol" folder content
            modules: [
                { id: '01', name: 'LCC Veto', link: 'protocol/anohub_protocol_v2.html', color: '#06b6d4', desc: 'Financial firewall logic.' },
                { id: '02', name: 'NDT Metrology', link: 'protocol/anohub_methodology_v2.html', color: '#8b5cf6', desc: 'Deep-scan verification.' },
                { id: '03', name: 'Org Intelligence', link: 'protocol/anohub_organization_v2.html', color: '#f97316', desc: 'Governance models.' },
                { id: '04', name: 'M-E Synergy', link: 'protocol/anohub_synergy_v2.html', color: '#facc15', desc: 'Electro-mech harmonics.' },
                { id: '05', name: 'Alignment', link: 'protocol/anohub_alignment_v2.html', color: '#3b82f6', desc: 'Precision centering.' },
                { id: '06', name: 'Predictive AI', link: 'protocol/anohub_predictive_v2.html', color: '#10b981', desc: 'RUL forecasting.' },
                { id: '07', name: 'Fluid Dynamics', link: 'protocol/anohub_fluid_v2.html', color: '#06b6d4', desc: 'CFD cavitation analysis.' },
                { id: '08', name: 'Mag Flux', link: 'protocol/anohub_flux_v2.html', color: '#ff5722', desc: 'Air gap monitoring.' },
                { id: '09', name: 'Cost Opt', link: 'protocol/anohub_cost_v2.html', color: '#10b981', desc: 'Arbitrage & inventory.' },
                { id: '10', name: 'Flood Gate', link: 'protocol/anohub_flood_v2.html', color: '#3b82f6', desc: 'Spillway control.' },
                { id: '11', name: 'Vib Damp', link: 'protocol/anohub_vib_v2.html', color: '#d946ef', desc: 'Active cancellation.' },
                { id: '12', name: 'Dam Struct', link: 'protocol/anohub_dam_v2.html', color: '#78716c', desc: 'Stability & uplift.' },
                { id: '13', name: 'Sat Uplink', link: 'protocol/anohub_sat_v2.html', color: '#06b6d4', desc: 'Geospatial data.' },
                { id: '14', name: 'Black Box', link: 'protocol/anohub_blackbox_v2.html', color: '#f97316', desc: 'Forensic logging.' },
                { id: '15', name: 'SCADA OVR', link: 'protocol/anohub_scada_v2.html', color: '#ef4444', desc: 'Security override.' }, // Corrected to _v2 based on standard
                { id: '16', name: 'Asset Life', link: 'protocol/anohub_asset_v2.html', color: '#34d399', desc: 'Lifecycle mgmt.' },
                { id: '17', name: 'ISO Audit', link: 'protocol/anohub_iso_v2.html', color: '#FFD700', desc: 'IMS compliance.' },
                { id: '18', name: 'Global Link', link: 'protocol/anohub_global_v2.html', color: '#3b82f6', desc: 'Grid connection.' },
                { id: '19', name: 'Quantum Load', link: 'protocol/anohub_quantum_v2.html', color: '#a855f7', desc: 'Optimization algo.' },
                { id: '20', name: 'Thermal AI', link: 'protocol/anohub_thermal_v2.html', color: '#ef4444', desc: 'Hotspot detection.' },
                { id: '21', name: 'Core Temp', link: 'protocol/anohub_core_v2.html', color: '#ff5722', desc: 'Stator integrity.' },
                { id: '22', name: 'Turbine Sync', link: 'protocol/anohub_sync_v2.html', color: '#facc15', desc: 'Grid synchronization.' }, // Added missing SYNC module
                { id: '99', name: 'AI Core', link: '#', color: '#FFD700', desc: 'Central Intelligence.', isSpecial: true }
            ],

            init() {
                this.buildSolarSystem();
                this.buildGrid();
                this.initMatrix('matrix-bg', '#0F0'); // Background Matrix (Green/Subtle)
                lucide.createIcons();
            },

            // === 1. BUILD 3D SOLAR SYSTEM ===
            buildSolarSystem() {
                const system = document.getElementById('galaxy');
                
                // Rings: Radius, Speed, Module Subset
                const rings = [
                    { r: 175, speed: 25, items: this.modules.slice(0, 8) },   
                    { r: 275, speed: 40, items: this.modules.slice(8, 16) },  
                    { r: 425, speed: 60, items: this.modules.slice(16, 23) }  
                ];

                rings.forEach((ring, idx) => {
                    const orbitContainer = document.createElement('div');
                    orbitContainer.style.position = 'absolute';
                    orbitContainer.style.top = '50%'; orbitContainer.style.left = '50%';
                    orbitContainer.style.width = '0'; orbitContainer.style.height = '0';
                    orbitContainer.style.transformStyle = 'preserve-3d';
                    orbitContainer.style.animation = `spin-orbit ${ring.speed}s linear infinite`;
                    if(idx % 2 !== 0) orbitContainer.style.animationDirection = 'reverse';
                    
                    // CRITICAL: Pointer events none on container so it doesn't block clicks on planets
                    orbitContainer.style.pointerEvents = 'none';
                    
                    system.appendChild(orbitContainer);

                    const step = (2 * Math.PI) / ring.items.length;

                    ring.items.forEach((m, i) => {
                        const angle = step * i;
                        const x = Math.cos(angle) * ring.r;
                        const z = Math.sin(angle) * ring.r;

                        const link = document.createElement('a');
                        link.className = 'planet-link';
                        
                        // Set Link
                        if(m.isSpecial) {
                            link.href = "#";
                            link.onclick = (e) => { e.preventDefault(); App.deployAI(); };
                        } else {
                            link.href = m.link;
                        }
                        
                        // Position
                        link.style.transform = `translate3d(${x}px, 0, ${z}px) rotateX(-90deg)`;
                        
                        link.innerHTML = `
                            <div class="planet-content">
                                <div class="planet-body" style="border-color: ${m.color}; box-shadow: 0 0 15px ${m.color}"></div>
                                <div class="planet-label" style="border-color: ${m.color}">
                                    <span style="color:${m.color}; margin-right:4px;">${m.id}</span> ${m.name}
                                </div>
                            </div>
                        `;
                        orbitContainer.appendChild(link);
                    });
                });
            },

            // === 2. BUILD GRID ===
            buildGrid() {
                const grid = document.getElementById('modules-grid');
                this.modules.forEach(m => {
                    const card = document.createElement('a');
                    card.className = 'module-card p-8 block group';
                    card.style.setProperty('--hover-color', m.color);
                    card.style.setProperty('--hover-glow', m.color + '40');

                    if(m.isSpecial) {
                        card.href = "#";
                        card.onclick = (e) => { e.preventDefault(); App.deployAI(); };
                    } else {
                        card.href = m.link;
                    }

                    card.innerHTML = `
                        <div class="flex justify-between items-center mb-6">
                            <span class="font-mono text-sm font-bold" style="color:${m.color}">SYS-${m.id}</span>
                            <div class="w-2 h-2 rounded-full shadow-[0_0_5px_white]" style="background-color:${m.color}"></div>
                        </div>
                        <h3 class="text-2xl font-divine text-white group-hover:text-[${m.color}] transition mb-2">${m.name}</h3>
                        <p class="text-sm text-slate-400 font-light mb-6 h-10">${m.desc}</p>
                        <div class="h-0.5 w-12 bg-white/20 group-hover:w-full transition-all duration-500" style="background-color:${m.color}"></div>
                    `;
                    grid.appendChild(card);
                });
            },

            // === 3. AI DEPLOYMENT ===
            deployAI() {
                const overlay = document.getElementById('ai-takeover');
                const box = document.getElementById('ai-box');
                const bar = document.getElementById('ai-progress-bar');
                const log = document.getElementById('ai-log');
                
                overlay.classList.remove('hidden'); overlay.classList.add('flex');
                setTimeout(() => document.getElementById('ai-status-box').classList.remove('scale-0'), 100);
                
                this.initMatrix('matrix-overlay', '#FFD700'); // Gold Matrix for AI
                log.innerHTML = ''; bar.style.width = '0%';
                
                const msgs = ["NEURAL HANDSHAKE...", "BYPASSING FIREWALL...", "OPTIMIZING TOPOLOGY...", "ACCESS GRANTED."];
                msgs.forEach((m, i) => {
                    setTimeout(() => {
                        log.innerHTML = `> ${m}<br>` + log.innerHTML;
                        bar.style.width = `${(i+1)*25}%`;
                    }, i*1000 + 500);
                });

                setTimeout(() => {
                    document.getElementById('ai-status-box').classList.add('scale-0');
                    setTimeout(() => { overlay.classList.add('hidden'); overlay.classList.remove('flex'); }, 300);
                }, 5000);
            },

            // === 4. MATRIX ENGINE ===
            initMatrix(canvasId, color) {
                const c = document.getElementById(canvasId);
                if(!c) return;
                const ctx = c.getContext('2d');
                c.width = window.innerWidth; c.height = window.innerHeight;
                const cols = Math.floor(c.width/20); 
                const drops = Array(cols).fill(1);

                setInterval(() => {
                    ctx.fillStyle = 'rgba(0,0,0,0.05)'; ctx.fillRect(0,0,c.width,c.height);
                    ctx.fillStyle = color; ctx.font = '14px monospace';
                    for(let i=0; i<drops.length; i++) {
                        const text = String.fromCharCode(Math.random()*128);
                        ctx.fillText(text, i*20, drops[i]*20);
                        if(drops[i]*20 > c.height && Math.random()>0.975) drops[i]=0;
                        drops[i]++;
                    }
                }, 35);
            }
        };

        document.addEventListener('DOMContentLoaded', () => App.init());
    </script>
</body>
</html>
