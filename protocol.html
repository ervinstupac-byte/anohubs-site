<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="protocol_page.title">AnoHUB | PROTOCOL SYSTEM</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&family=Roboto+Mono:wght@300;400;700&display=swap"
        rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <link rel="stylesheet" href="assets/css/preloader.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { mono: ['Roboto Mono', 'monospace'], header: ['Oswald', 'sans-serif'] },
                    colors: { 'h-gold': '#FFB800', 'h-cyan': '#06b6d4' }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #020617;
            color: white;
            overflow: hidden;
            height: 100vh;
            margin: 0;
        }

        /* === KEYFRAMES === */
        @keyframes spin-orbit {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        @keyframes counter-spin {
            from {
                transform: rotate(360deg);
            }

            to {
                transform: rotate(0deg);
            }
        }

        /* === MATRIX BACKGROUND === */
        .matrix-bg {
            position: fixed;
            inset: 0;
            z-index: -2;
            background-image:
                linear-gradient(rgba(6, 182, 212, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(6, 182, 212, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            mask-image: radial-gradient(circle at center, black 40%, transparent 100%);
        }

        .stars {
            position: fixed;
            inset: 0;
            z-index: -3;
            background-image: radial-gradient(white, rgba(255, 255, 255, .1) 1px, transparent 2px);
            background-size: 300px 300px;
            opacity: 0.3;
        }

        /* === SYSTEM CORE === */
        #solar-system {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 1000px;
            height: 1000px;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            /* Let clicks pass to planets */
        }

        .core-sun-wrapper {
            position: absolute;
            pointer-events: auto;
            z-index: 20;
        }

        .core-sun {
            width: 140px;
            height: 140px;
            border: 2px solid #FFB800;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Oswald', sans-serif;
            font-weight: 700;
            font-size: 60px;
            color: #FFB800;
            box-shadow: 0 0 60px rgba(255, 184, 0, 0.2), inset 0 0 20px rgba(255, 184, 0, 0.1);
            background: rgba(0, 0, 0, 0.8);
            transition: all 0.5s;
            text-decoration: none;
        }

        /* PLANET STYLES (Dynamic) */
        /* 1. CONTAINER - MUST PASS CLICKS THROUGH */
        .universe-container,
        #galaxy,
        .orbit-container {
            pointer-events: none !important;
            z-index: 10;
        }

        /* 2. PLANET LINKS - MUST BE CLICKABLE */
        .planet-link {
            position: absolute;
            /* Force a real clickable area */
            width: 120px;
            height: 80px;
            /* Center the hit-box */
            transform-style: preserve-3d;
            /* AGGRESSIVE CLICK FIXES: */
            pointer-events: auto !important;
            z-index: 9999 !important;
            /* Put on top of EVERYTHING */
            cursor: pointer;

            /* Visual alignment */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }

        /* 3. ENSURE SUN IS CLICKABLE */
        .sun,
        .core-sun {
            pointer-events: auto !important;
            z-index: 9999 !important;
            cursor: pointer;
        }

        .planet-content {
            /* Critical: Counter-rotate to keep text upright relative to the screen */
            animation: spin-orbit 120s linear infinite reverse;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transform-origin: center center;
            width: 120px;
            /* Fixed width for stability */
        }

        /* Dynamic animation speeds will be applied via JS */

        .planet-core {
            width: 14px;
            height: 14px;
            background: #020617;
            border: 2px solid;
            border-radius: 50%;
            box-shadow: 0 0 15px currentColor;
            transition: all 0.3s ease;
        }

        .planet-label {
            margin-top: 8px;
            font-family: 'Roboto Mono', monospace;
            font-size: 10px;
            font-weight: bold;
            color: rgba(255, 255, 255, 0.6);
            background: rgba(2, 6, 23, 0.8);
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            white-space: nowrap;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 0 5px black;
        }

        .planet-link:hover .planet-core {
            transform: scale(1.5);
            background: white;
            border-color: white !important;
        }

        .planet-link:hover .planet-label {
            color: white;
            border-color: currentColor;
            opacity: 1;
            transform: scale(1.1);
        }

        /* === SEARCH UI === */
        #search-ui {
            position: fixed;
            top: 120px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 50;
            width: 300px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #FFB800;
        }

        #search-input {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: #FFB800;
            font-family: 'Oswald', sans-serif;
            font-size: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
            padding: 10px;
        }

        /* === AI OVERLAY === */
        #ai-takeover {
            display: none;
        }

        /* Hidden by default */
    </style>
</head>

<body>
    <div id="global-header" class="fixed top-0 left-0 w-full z-[9999]"></div>
    <div class="matrix-bg"></div>
    <div class="stars"></div>

    <div id="search-ui">
        <input type="text" id="search-input" placeholder="INITIATE SEARCH..." autocomplete="off"
            data-i18n="[placeholder]protocol_page.search_placeholder">
    </div>

    <div id="solar-system">
        <div class="core-sun-wrapper">
            <a href="index.html" class="core-sun">A</a>
        </div>
        <!-- Rings Injected Here -->
        <div id="galaxy"></div>
    </div>

    <!-- Scripts -->
    <script src="assets/js/layout-loader.js"></script>
    <script>
        const App = {
            modules: [
                { id: '01', nameKey: 'core', link: 'protocol/anohub_protocol_v2.html', color: '#06b6d4' },
                { id: '02', nameKey: 'ndt', link: 'protocol/anohub_methodology_v2.html', color: '#8b5cf6' },
                { id: '03', nameKey: 'org', link: 'protocol/anohub_organization_v2.html', color: '#f97316' },
                { id: '04', nameKey: 'synergy', link: 'protocol/anohub_synergy_v2.html', color: '#facc15' },
                { id: '05', nameKey: 'alignment', link: 'protocol/anohub_alignment_v2.html', color: '#3b82f6' },
                { id: '06', nameKey: 'predictive', link: 'protocol/anohub_predictive_v2.html', color: '#10b981' },
                { id: '07', nameKey: 'fluid', link: 'protocol/anohub_fluid_v2.html', color: '#06b6d4' },
                { id: '08', nameKey: 'flux', link: 'protocol/anohub_flux_v2.html', color: '#ff5722' },
                { id: '09', nameKey: 'cost', link: 'protocol/anohub_cost_v2.html', color: '#10b981' },
                { id: '10', nameKey: 'flood', link: 'protocol/anohub_flood_v2.html', color: '#3b82f6' },
                { id: '11', nameKey: 'vib', link: 'protocol/anohub_vibration_v3.html', color: '#d946ef' },
                { id: '12', nameKey: 'dam', link: 'protocol/anohub_dam_v2.html', color: '#78716c' },
                { id: '13', nameKey: 'sat', link: 'protocol/anohub_sat_v2.html', color: '#06b6d4' },
                { id: '14', nameKey: 'logs', link: 'protocol/anohub_scada_v2.html', color: '#f97316' },
                { id: '15', nameKey: 'ovr', link: 'protocol/anohub_scada_override_v2.html', color: '#ef4444' },
                { id: '16', nameKey: 'life', link: 'protocol/anohub_asset_v2.html', color: '#34d399' },
                { id: '17', nameKey: 'iso', link: 'protocol/anohub_iso_v2.html', color: '#FFD700' },
                { id: '18', nameKey: 'global', link: 'protocol/anohub_global_v2.html', color: '#3b82f6' },
                { id: '19', nameKey: 'quantum', link: 'protocol/anohub_quantum_v2.html', color: '#a855f7' },
                { id: '20', nameKey: 'thermal', link: 'protocol/anohub_thermal_v2.html', color: '#ef4444' },
                { id: '21', nameKey: 'temp', link: 'protocol/anohub_core_v2.html', color: '#ff5722' },
                { id: '22', nameKey: 'sync', link: 'protocol/anohub_sync_v2.html', color: '#facc15' },
                { id: '23', nameKey: 'cavitation', link: 'protocol/anohub_cavitation_v2.html', color: '#06b6d4' },
                { id: '99', nameKey: 'ai', link: '#', color: '#FFD700', isSpecial: true }
            ],

            init() {
                this.buildSolarSystem();
                this.initSearch();
            },

            buildSolarSystem() {
                const system = document.getElementById('galaxy');
                system.innerHTML = ''; // Clear previous content
                // Kept sun separate in HTML structure to avoid duplication/style mismatch

                const itemsPerRing = 8;
                let currentRadius = 220;
                let currentSpeed = 40;
                for (let i = 0; i < this.modules.length; i += itemsPerRing) {
                    const chunk = this.modules.slice(i, i + itemsPerRing);

                    // Create Orbit Ring (Visual)
                    const orbitRing = document.createElement('div');
                    Object.assign(orbitRing.style, {
                        position: 'absolute', top: '50%', left: '50%',
                        width: `${currentRadius * 2}px`, height: `${currentRadius * 2}px`,
                        border: '1px dashed rgba(255,255,255,0.1)', borderRadius: '50%',
                        transform: 'translate(-50%, -50%)', pointerEvents: 'none'
                    });
                    system.appendChild(orbitRing);
                    // Create Rotating Container for Planets
                    const rotator = document.createElement('div');
                    Object.assign(rotator.style, {
                        position: 'absolute', top: '50%', left: '50%', width: '0', height: '0',
                        animation: `spin-orbit ${currentSpeed}s linear infinite`,
                        transformStyle: 'preserve-3d',
                        pointerEvents: 'none' // CRITICAL FIX
                    });
                    // Alternate direction
                    if (i % 2 !== 0) rotator.style.animationDirection = 'reverse';

                    system.appendChild(rotator);
                    const step = (2 * Math.PI) / chunk.length;
                    chunk.forEach((m, idx) => {
                        const angle = step * idx;
                        const x = Math.cos(angle) * currentRadius;
                        const y = Math.sin(angle) * currentRadius;
                        const link = document.createElement('a');
                        link.className = 'planet-link';
                        if (m.isSpecial) {
                            link.href = "#"; link.onclick = (e) => { e.preventDefault(); App.deployAI(); };
                        } else {
                            link.href = m.link;
                        }

                        // Position the planet
                        link.style.transform = `translate(${x}px, ${y}px)`;
                        // Calculate Counter-Animation duration match
                        const counterDir = (i % 2 !== 0) ? 'normal' : 'reverse'; // Opposite of parent
                        link.innerHTML = `
                        <div class="planet-content" style="animation: spin-orbit ${currentSpeed}s linear infinite ${counterDir}">
                            <div class="planet-core" style="border-color: ${m.color}; box-shadow: 0 0 10px ${m.color}"></div>
                            <div class="planet-label" style="border-color: rgba(255,255,255,0.1); color: ${m.color}" data-i18n="protocol_modules.${m.nameKey}">
                                ${m.nameKey}
                            </div>
                        </div>
                    `;
                        rotator.appendChild(link);
                    });
                    currentRadius += 140;
                    currentSpeed += 30;
                }
            },

            initSearch() {
                const input = document.getElementById('search-input');
                if (!input) return;
                input.addEventListener('input', (e) => {
                    const val = e.target.value.toLowerCase().trim();
                    const links = document.querySelectorAll('.planet-link');
                    links.forEach(l => {
                        const text = l.innerText.toLowerCase();
                        if (val === "" || text.includes(val)) {
                            l.style.opacity = '1';
                            l.style.filter = 'none';
                        } else {
                            l.style.opacity = '0.1';
                            l.style.filter = 'grayscale(100%)';
                        }
                    });
                });
            }
        };

        document.addEventListener('DOMContentLoaded', () => App.init());
    </script>
</body>

</html>
