<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnoHUB | THE HOLY NEXUS</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=JetBrains+Mono:wght@300;500&family=Rajdhani:wght@300;600&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { 
            theme: { 
                extend: { 
                    fontFamily: { 
                        sans: ['Rajdhani', 'sans-serif'], 
                        mono: ['JetBrains Mono', 'monospace'],
                        divine: ['Cinzel', 'serif'] 
                    },
                    colors: { 
                        'h-gold': '#FFD700',   
                        'h-void': '#000000',   
                        'h-glass': 'rgba(20, 20, 20, 0.6)',
                        'h-cyan': '#06b6d4',
                        'h-white': '#F8FAFC'
                    },
                    animation: {
                        'spin-orbit': 'spin 120s linear infinite',
                        'pulse-slow': 'pulse 4s ease-in-out infinite',
                        'float': 'float 6s ease-in-out infinite',
                    },
                    keyframes: {
                        float: { '0%, 100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-10px)' } }
                    }
                } 
            }
        }
    </script>

    <style>
        body { background-color: #000; color: #e2e8f0; overflow: hidden; }
        
        /* 1. MATRIX BACKGROUND LAYER */
        .matrix-layer { position: fixed; inset: 0; z-index: -2; opacity: 0.05; pointer-events: none; }
        
        /* 2. HOLY GRID LAYER */
        .holy-grid {
            position: fixed; inset: 0; z-index: -1;
            background-image: 
                linear-gradient(rgba(255, 215, 0, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 215, 0, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            mask-image: radial-gradient(circle at center, black 20%, transparent 100%);
            pointer-events: none;
        }

        /* 3D ENGINE */
        #universe {
            position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
            display: flex; align-items: center; justify-content: center;
            perspective: 1500px; overflow: hidden;
        }

        #galaxy {
            position: relative; width: 0; height: 0;
            transform-style: preserve-3d;
            animation: spin-orbit 80s linear infinite;
        }
        
        /* Stop rotation on hover to allow clicking */
        #universe:hover #galaxy { animation-play-state: paused; }

        /* THE PLANETS (MODULES) */
        .planet {
            position: absolute; left: 50%; top: 50%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transform-style: preserve-3d;
            cursor: pointer; text-decoration: none;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .planet-core {
            width: 12px; height: 12px; background: white; border-radius: 50%;
            box-shadow: 0 0 15px white; border: 1px solid #FFD700;
            transition: all 0.3s;
        }

        .planet-label {
            margin-top: 10px; font-family: 'JetBrains Mono', monospace; font-size: 10px;
            color: #aaa; text-shadow: 0 2px 4px black; background: rgba(0,0,0,0.8);
            padding: 4px 8px; border: 1px solid #333; border-radius: 4px;
            white-space: nowrap; pointer-events: none; /* Let clicks pass through label to parent */
            transition: all 0.3s;
        }
        
        .planet-number {
            font-weight: bold; color: #FFD700; margin-right: 5px;
        }

        /* HOVER EFFECT */
        .planet:hover { z-index: 1000; }
        .planet:hover .planet-core { transform: scale(2); background: #FFD700; box-shadow: 0 0 30px #FFD700; }
        .planet:hover .planet-label { color: white; border-color: #FFD700; transform: scale(1.2); }

        /* CENTRAL SUN */
        .sun {
            position: absolute; width: 100px; height: 100px;
            background: radial-gradient(circle, #fff 20%, #FFD700 100%);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 100px rgba(255, 215, 0, 0.6), inset 0 0 60px white;
            display: flex; align-items: center; justify-content: center;
            z-index: 10;
        }
        .sun-text { font-family: 'Cinzel', serif; font-weight: 900; color: black; font-size: 24px; letter-spacing: 2px; }

    </style>
</head>
<body>

    <canvas id="matrix-canvas" class="matrix-layer"></canvas>
    <div class="holy-grid"></div>

    <div class="fixed top-0 left-0 w-full z-50 p-6 flex justify-between items-start pointer-events-none">
        <div>
            <h1 class="text-4xl font-divine text-white tracking-widest drop-shadow-lg">AnoHUB</h1>
            <div class="h-px w-24 bg-h-gold mt-2"></div>
            <p class="text-[10px] font-mono text-h-gold mt-1">PROTOCOL INTERFACE v26.0</p>
        </div>
        <div class="text-right hidden md:block">
            <div class="text-[10px] font-mono text-slate-400">SYSTEM STATUS</div>
            <div class="text-lg font-divine text-white">NOMINAL</div>
        </div>
    </div>

    <div id="universe">
        <div id="galaxy">
            
            <div class="sun">
                <span class="sun-text">A</span>
            </div>

            <div class="absolute border border-white/10 rounded-full w-[400px] h-[400px] -translate-x-1/2 -translate-y-1/2 transform rotate-x-90"></div>
            <div class="absolute border border-white/5 rounded-full w-[600px] h-[600px] -translate-x-1/2 -translate-y-1/2 transform rotate-x-90"></div>
            <div class="absolute border border-h-gold/10 rounded-full w-[800px] h-[800px] -translate-x-1/2 -translate-y-1/2 transform rotate-y-45"></div>

            </div>
    </div>

    <div class="fixed bottom-8 w-full text-center pointer-events-none">
        <p class="text-[10px] font-mono text-slate-500 uppercase tracking-[0.3em] animate-pulse">Hover to pause • Click to access protocol</p>
    </div>

    <script>
        const App = {
            // MASTER LIST - TOČNI LINKOVI
            modules: [
                { id: '01', name: 'LCC Veto', link: 'protocol/anohub_protocol_v2.html' },
                { id: '02', name: 'NDT Metrology', link: 'protocol/anohub_methodology_v2.html' },
                { id: '03', name: 'Org Intelligence', link: 'protocol/anohub_organization_v2.html' },
                { id: '04', name: 'M-E Synergy', link: 'protocol/anohub_synergy_v2.html' },
                { id: '05', name: 'Alignment', link: 'protocol/anohub_alignment_v2.html' },
                { id: '06', name: 'Predictive AI', link: 'protocol/anohub_predictive_v2.html' },
                { id: '07', name: 'Fluid Dynamics', link: 'protocol/anohub_fluid_v2.html' },
                { id: '08', name: 'Mag Flux', link: 'protocol/anohub_flux_v2.html' },
                { id: '09', name: 'Cost Opt', link: 'protocol/anohub_cost_v2.html' },
                { id: '10', name: 'Flood Gate', link: 'protocol/anohub_flood_v2.html' },
                { id: '11', name: 'Vib Damp', link: 'protocol/anohub_vib_v2.html' },
                { id: '12', name: 'Dam Struct', link: 'protocol/anohub_dam_v2.html' },
                { id: '13', name: 'Sat Uplink', link: 'protocol/anohub_sat_v2.html' },
                { id: '14', name: 'Black Box', link: 'protocol/anohub_blackbox_v2.html' },
                { id: '15', name: 'SCADA OVR', link: 'protocol/anohub_scada_v2.html' },
                { id: '16', name: 'Asset Life', link: 'protocol/anohub_asset_v2.html' },
                { id: '17', name: 'ISO Audit', link: 'protocol/anohub_iso_v2.html' },
                { id: '18', name: 'Global Link', link: 'protocol/anohub_global_v2.html' },
                { id: '19', name: 'Quantum Load', link: 'protocol/anohub_quantum_v2.html' },
                { id: '20', name: 'Thermal AI', link: 'protocol/anohub_thermal_v2.html' },
                { id: '21', name: 'Core Temp', link: 'protocol/anohub_core_v2.html' },
                { id: '99', name: 'AI Core', link: '#', isSpecial: true }
            ],

            init() {
                this.initGalaxy();
                this.initMatrix();
            },

            // GENERATE THE 3D GALAXY
            initGalaxy() {
                const galaxy = document.getElementById('galaxy');
                const count = this.modules.length;
                
                // Fibonacci Sphere Algorithm for even distribution
                const phi = Math.PI * (3 - Math.sqrt(5)); // Golden angle

                this.modules.forEach((m, i) => {
                    const y = 1 - (i / (count - 1)) * 2; // y goes from 1 to -1
                    const radius = Math.sqrt(1 - y * y); // Radius at y
                    
                    const theta = phi * i; // Golden angle increment

                    const r = 350; // Sphere radius in px

                    const xPos = Math.cos(theta) * radius * r;
                    const zPos = Math.sin(theta) * radius * r;
                    const yPos = y * r;

                    // Create Planet Element
                    const el = document.createElement('a');
                    el.href = m.link;
                    el.className = 'planet';
                    
                    // 3D Positioning
                    el.style.transform = `translate3d(${xPos}px, ${yPos}px, ${zPos}px)`;
                    
                    // Apply counter-rotation to keep text facing forward (billboard effect via JS later if needed, but CSS preserve-3d handles most)
                    // Actually, for pure CSS rotation, text will rotate. 
                    // To fix text readability, we animate the text container counter to the galaxy rotation? 
                    // Simpler: Just let them float.

                    el.innerHTML = `
                        <div class="planet-core" style="${m.isSpecial ? 'background:#00f0ff; box-shadow:0 0 20px #00f0ff; border-color:white;' : ''}"></div>
                        <div class="planet-label">
                            <span class="planet-number">${m.id}</span> ${m.name}
                        </div>
                    `;

                    // AI Core Special Behavior (Alert only)
                    if(m.isSpecial) {
                        el.onclick = (e) => {
                            e.preventDefault();
                            alert("AI CORE: MONITORING SYSTEM...");
                        }
                    }

                    galaxy.appendChild(el);
                });
            },

            // SUBTLE MATRIX BACKGROUND
            initMatrix() {
                const c = document.getElementById('matrix-canvas');
                const ctx = c.getContext('2d');
                c.width = window.innerWidth; c.height = window.innerHeight;
                
                const cols = Math.floor(c.width/20); 
                const drops = Array(cols).fill(1);

                setInterval(() => {
                    ctx.fillStyle = 'rgba(0,0,0,0.05)'; 
                    ctx.fillRect(0,0,c.width,c.height);
                    ctx.fillStyle = '#0f0'; // Green matrix, very faint
                    ctx.font = '10px monospace';
                    
                    for(let i=0; i<drops.length; i++) {
                        const text = String.fromCharCode(Math.random()*128);
                        const x = i*20; 
                        const y = drops[i]*20;
                        
                        // Only draw randomly to keep it subtle
                        if(Math.random() > 0.95) {
                            ctx.fillStyle = 'rgba(6,182,212,0.3)'; // Cyan faint
                            ctx.fillText(text, x, y);
                        }

                        if(y > c.height && Math.random() > 0.975) drops[i] = 0;
                        drops[i]++;
                    }
                }, 50);
            }
        };

        document.addEventListener('DOMContentLoaded', () => App.init());
    </script>
</body>
</html>
