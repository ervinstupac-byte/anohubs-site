<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnoHUB | OMEGA INTERFACE v33.0</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=JetBrains+Mono:wght@300;500;800&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { 
            theme: { 
                extend: { 
                    fontFamily: { 
                        sans: ['Rajdhani', 'sans-serif'], 
                        mono: ['JetBrains Mono', 'monospace'],
                        divine: ['Cinzel', 'serif'] 
                    },
                    colors: { 
                        'h-gold': '#FFD700', 'h-void': '#050505', 
                        'm-cyan': '#06b6d4', 'm-purple': '#8b5cf6', 'm-orange': '#f97316', 'm-yellow': '#facc15',
                        'm-blue': '#3b82f6', 'm-green': '#10b981', 'm-red': '#ef4444', 'm-magma': '#ff5722',
                        'm-stone': '#78716c', 'm-emerald': '#34d399', 'm-fuchsia': '#d946ef'
                    },
                    animation: { 
                        'spin-orbit': 'spin 120s linear infinite', 
                        'pulse-glow': 'pulseGlow 3s infinite',
                        'float': 'float 6s ease-in-out infinite'
                    },
                    keyframes: {
                        pulseGlow: { '0%, 100%': { boxShadow: '0 0 30px rgba(255, 215, 0, 0.2)' }, '50%': { boxShadow: '0 0 80px rgba(255, 215, 0, 0.6)' } },
                        float: { '0%, 100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-10px)' } }
                    }
                } 
            }
        }
    </script>

    <style>
        body { background-color: #000; color: #e2e8f0; overflow-x: hidden; cursor: crosshair; }
        
        /* BACKGROUNDS */
        .matrix-layer { position: fixed; inset: 0; z-index: -2; opacity: 0.3; pointer-events: none; mix-blend-mode: screen; }
        .holy-grid {
            position: fixed; inset: 0; z-index: -1;
            background-image: linear-gradient(rgba(255, 215, 0, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 215, 0, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            mask-image: radial-gradient(circle at 50% 50%, black 10%, transparent 100%);
            pointer-events: none;
        }

        /* 3D UNIVERSE */
        .universe-container {
            height: 85vh; width: 100%;
            display: flex; align-items: center; justify-content: center;
            perspective: 1200px; position: relative; z-index: 10;
        }
        
        /* Hide 3D on small screens to prevent lag/bad UX */
        @media (max-width: 768px) {
            .universe-container { display: none; }
            #full-matrix { padding-top: 150px; }
        }

        #galaxy {
            position: relative; width: 0; height: 0;
            transform-style: preserve-3d;
            animation: spin-orbit 80s linear infinite;
            pointer-events: none;
        }
        .universe-container:hover #galaxy { animation-play-state: paused; }

        .orbit-ring {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 50%; transform-style: preserve-3d; pointer-events: none;
        }

        /* PLANET (LINK) STYLING */
        .planet-link {
            position: absolute; top: 50%; left: 50%;
            width: 60px; height: 60px; margin-left: -30px; margin-top: -30px;
            display: flex; align-items: center; justify-content: center;
            transform-style: preserve-3d; cursor: pointer; text-decoration: none;
            pointer-events: auto !important; z-index: 100;
        }

        .planet-body {
            width: 14px; height: 14px; border-radius: 50%; background: #000; border: 2px solid;
            box-shadow: 0 0 15px currentColor; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .planet-label {
            position: absolute; top: 35px; left: 50%; transform: translateX(-50%);
            font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: bold;
            color: white; background: rgba(0,0,0,0.8); padding: 4px 8px; border-radius: 4px;
            border: 1px solid #444; white-space: nowrap; opacity: 0.7; transition: all 0.3s; pointer-events: none;
        }

        .planet-link:hover { z-index: 9999; }
        .planet-link:hover .planet-body { transform: scale(2.5); background: white; box-shadow: 0 0 60px white; border-color: white !important; }
        .planet-link:hover .planet-label { opacity: 1; color: #FFD700; border-color: #FFD700; transform: translateX(-50%) scale(1.2); background: black; }

        /* THE SUN */
        .sun {
            position: absolute; width: 100px; height: 100px;
            background: radial-gradient(circle, #fff 10%, #FFD700 100%);
            border-radius: 50%; transform: translate(-50%, -50%);
            box-shadow: 0 0 120px rgba(255, 215, 0, 0.6), inset 0 0 50px white;
            display: flex; align-items: center; justify-content: center;
            font-family: 'Cinzel', serif; font-weight: 900; color: black; font-size: 32px;
            pointer-events: none; z-index: 10;
        }

        /* MODULE CARDS */
        .module-card {
            background: linear-gradient(180deg, rgba(15,15,15,0.95) 0%, rgba(5,5,5,1) 100%);
            border: 1px solid rgba(255,255,255,0.15); transition: all 0.3s ease;
        }
        .module-card:hover { transform: translateY(-5px); border-color: var(--hover-color); box-shadow: 0 0 40px var(--hover-glow); }
        
        /* SEARCH INPUT */
        .search-input:focus { outline: none; border-color: #FFD700; box-shadow: 0 0 20px rgba(255,215,0,0.2); }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #FFD700; }
    </style>
</head>
<body>

    <canvas id="matrix-canvas" class="matrix-layer"></canvas>
    <div class="holy-grid"></div>

    <div class="fixed top-0 left-0 w-full z-50 p-6 flex justify-between items-center bg-gradient-to-b from-black via-black/80 to-transparent pointer-events-none">
        <div class="pointer-events-auto flex items-center gap-8">
            <a href="index.html" class="group block">
                <h1 class="text-3xl md:text-4xl font-divine text-white tracking-[0.2em] drop-shadow-lg group-hover:text-h-gold transition">AnoHUB</h1>
                <div class="h-0.5 w-12 bg-h-gold mt-1 mb-1 group-hover:w-24 transition-all duration-500"></div>
            </a>
            
            <button id="audio-btn" onclick="App.toggleAudio()" class="text-slate-500 hover:text-h-gold transition flex items-center gap-2">
                <svg id="icon-vol" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
                <span class="text-[10px] font-mono" id="text-vol">SFX: ON</span>
            </button>
        </div>

        <div class="text-right hidden md:block">
            <div class="text-[10px] font-mono text-slate-400">SYSTEM STATUS</div>
            <div class="text-lg font-divine text-h-green animate-pulse">OPERATIONAL</div>
        </div>
    </div>

    <div class="universe-container">
        <div id="galaxy">
            <div class="sun animate-pulse-glow">A</div>
            <div class="orbit-ring w-[300px] h-[300px]" style="transform: translate(-50%, -50%) rotateX(90deg);"></div>
            <div class="orbit-ring w-[500px] h-[500px]" style="transform: translate(-50%, -50%) rotateX(90deg);"></div>
            <div class="orbit-ring w-[700px] h-[700px]" style="transform: translate(-50%, -50%) rotateX(90deg);"></div>
            </div>
        
        <div class="absolute bottom-10 text-center w-full animate-bounce pointer-events-none">
            <p class="text-[10px] font-mono text-h-gold mb-2 tracking-widest">ACCESS FULL MATRIX ▼</p>
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFD700" stroke-width="2" class="mx-auto"><path d="m7 13 5 5 5-5"/><path d="m7 6 5 5 5-5"/></svg>
        </div>
    </div>

    <section id="full-matrix" class="relative z-10 bg-black border-t border-h-gold/30 py-24 px-6 min-h-screen">
        <div class="max-w-7xl mx-auto">
            
            <div class="flex flex-col md:flex-row justify-between items-end mb-16 gap-6">
                <div class="flex items-center gap-4">
                    <div class="w-2 h-10 bg-h-gold shadow-[0_0_20px_#FFD700]"></div>
                    <div>
                        <h2 class="text-3xl font-divine text-white tracking-[0.15em]">PROTOCOL INDEX</h2>
                        <p class="text-xs text-slate-500 font-mono">Select a module to initiate.</p>
                    </div>
                </div>
                
                <div class="w-full md:w-64">
                    <input type="text" id="search-input" placeholder="SEARCH PROTOCOLS..." 
                           class="search-input w-full bg-slate-900 border border-slate-700 text-white px-4 py-2 rounded font-mono text-xs tracking-widest placeholder-slate-600 transition-all"
                           onkeyup="App.filterGrid()">
                </div>
            </div>

            <div id="modules-grid" class="grid md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
                </div>
        </div>
    </section>

    <div id="ai-takeover" class="fixed inset-0 z-[9999] bg-black hidden flex-col items-center justify-center">
        <canvas id="matrix-rain-canvas" class="absolute inset-0 w-full h-full"></canvas>
        <div class="absolute inset-0 flex flex-col items-center justify-center z-20 pointer-events-none">
            <div id="ai-status-box" class="bg-black/90 border-2 border-h-gold p-12 text-center backdrop-blur-xl shadow-[0_0_150px_rgba(255,215,0,0.3)] transform scale-0 transition-transform duration-500 w-full max-w-3xl">
                <h1 class="text-6xl font-black text-white tracking-tighter mb-4 font-divine">OMNISCIENCE</h1>
                <div class="text-h-gold font-mono text-xl animate-pulse">ESTABLISHING NEURAL HANDSHAKE...</div>
                <div class="w-full h-1 bg-slate-800 mt-8 overflow-hidden rounded"><div id="ai-progress-bar" class="h-full bg-h-gold w-0 transition-all duration-300 ease-out"></div></div>
                <div id="ai-logs" class="mt-6 font-mono text-xs text-slate-400 h-32 overflow-hidden text-left space-y-2 border-t border-slate-800 pt-4"></div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <script>
        const App = {
            audioEnabled: true,
            
            // === MASTER MODULE LIST ===
            modules: [
                { id: '01', name: 'LCC Veto', link: 'protocol/anohub_protocol_v2.html', color: 'm-cyan', desc: 'Financial firewall.' },
                { id: '02', name: 'NDT Metrology', link: 'protocol/anohub_methodology_v2.html', color: 'm-purple', desc: 'Deep-scan verification.' },
                { id: '03', name: 'Org Intelligence', link: 'protocol/anohub_organization_v2.html', color: 'm-orange', desc: 'Governance models.' },
                { id: '04', name: 'M-E Synergy', link: 'protocol/anohub_synergy_v2.html', color: 'm-yellow', desc: 'Electro-mech harmonics.' },
                { id: '05', name: 'Alignment', link: 'protocol/anohub_alignment_v2.html', color: 'm-blue', desc: '0.05mm tolerances.' },
                { id: '06', name: 'Predictive AI', link: 'protocol/anohub_predictive_v2.html', color: 'm-green', desc: 'RUL forecasting.' },
                { id: '07', name: 'Fluid Dynamics', link: 'protocol/anohub_fluid_v2.html', color: 'm-cyan', desc: 'CFD cavitation.' },
                { id: '08', name: 'Mag Flux', link: 'protocol/anohub_flux_v2.html', color: 'm-magma', desc: 'Air gap monitoring.' },
                { id: '09', name: 'Cost Opt', link: 'protocol/anohub_cost_v2.html', color: 'm-green', desc: 'Arbitrage logic.' },
                { id: '10', name: 'Flood Gate', link: 'protocol/anohub_flood_v2.html', color: 'm-blue', desc: 'Spillway control.' },
                { id: '11', name: 'Vib Damp', link: 'protocol/anohub_vib_v2.html', color: 'm-fuchsia', desc: 'Active cancellation.' },
                { id: '12', name: 'Dam Struct', link: 'protocol/anohub_dam_v2.html', color: 'm-stone', desc: 'Stability & uplift.' },
                { id: '13', name: 'Sat Uplink', link: 'protocol/anohub_sat_v2.html', color: 'm-cyan', desc: 'Geospatial data.' },
                { id: '14', name: 'Black Box', link: 'protocol/anohub_blackbox_v2.html', color: 'm-orange', desc: 'Forensic logging.' },
                { id: '15', name: 'SCADA OVR', link: 'protocol/anohub_scada_v2.html', color: 'm-red', desc: 'Security override.' },
                { id: '16', name: 'Asset Life', link: 'protocol/anohub_asset_v2.html', color: 'm-emerald', desc: 'Lifecycle mgmt.' },
                { id: '17', name: 'ISO Audit', link: 'protocol/anohub_iso_v2.html', color: 'm-gold', desc: 'IMS compliance.' },
                { id: '18', name: 'Global Link', link: 'protocol/anohub_global_v2.html', color: 'm-blue', desc: 'Grid connection.' },
                { id: '19', name: 'Quantum Load', link: 'protocol/anohub_quantum_v2.html', color: 'm-purple', desc: 'Optimization algo.' },
                { id: '20', name: 'Thermal AI', link: 'protocol/anohub_thermal_v2.html', color: 'm-red', desc: 'Hotspot detection.' },
                { id: '21', name: 'Core Temp', link: 'protocol/anohub_core_v2.html', color: 'm-magma', desc: 'Stator integrity.' },
                { id: '99', name: 'AI Core', link: '#', color: 'm-gold', desc: 'Central Intelligence.', isSpecial: true }
            ],

            init() {
                this.buildSolarSystem();
                this.buildGrid();
                this.initMatrix();
                lucide.createIcons();
            },

            toggleAudio() {
                this.audioEnabled = !this.audioEnabled;
                const btnText = document.getElementById('text-vol');
                const btnIcon = document.getElementById('icon-vol');
                
                if(this.audioEnabled) {
                    btnText.innerText = "SFX: ON";
                    btnText.className = "text-[10px] font-mono text-h-green";
                } else {
                    btnText.innerText = "SFX: OFF";
                    btnText.className = "text-[10px] font-mono text-slate-600";
                }
            },

            sfx(type) {
                if(!this.audioEnabled) return;
                try {
                    const AC = window.AudioContext || window.webkitAudioContext;
                    if (!AC) return;
                    if (!this.ctx) this.ctx = new AC();
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.connect(gain); gain.connect(this.ctx.destination);
                    const now = this.ctx.currentTime;

                    if (type === 'hover') {
                        osc.type = 'sine'; osc.frequency.setValueAtTime(600, now);
                        gain.gain.setValueAtTime(0.01, now); gain.gain.exponentialRampToValueAtTime(0.001, now+0.05);
                        osc.start(); osc.stop(now+0.05);
                    } else if (type === 'click') {
                        osc.type = 'triangle'; osc.frequency.setValueAtTime(200, now);
                        gain.gain.setValueAtTime(0.03, now); gain.gain.exponentialRampToValueAtTime(0.001, now+0.1);
                        osc.start(); osc.stop(now+0.1);
                    }
                } catch(e){}
            },

            // === ORBITAL SYSTEM ===
            buildSolarSystem() {
                const system = document.getElementById('solar-system');
                const rings = [
                    { r: 150, speed: 25, items: this.modules.slice(0, 7) },   
                    { r: 250, speed: 45, items: this.modules.slice(7, 14) },  
                    { r: 350, speed: 65, items: this.modules.slice(14, 22) }  
                ];

                rings.forEach((ring, idx) => {
                    const orbitContainer = document.createElement('div');
                    orbitContainer.style.position = 'absolute';
                    orbitContainer.style.top = '50%'; orbitContainer.style.left = '50%';
                    orbitContainer.style.width = '0'; orbitContainer.style.height = '0';
                    orbitContainer.style.transformStyle = 'preserve-3d';
                    orbitContainer.style.animation = `spin-orbit ${ring.speed}s linear infinite`;
                    if(idx % 2 !== 0) orbitContainer.style.animationDirection = 'reverse';
                    orbitContainer.style.pointerEvents = 'none'; // Allow clicks to pass
                    
                    system.appendChild(orbitContainer);

                    const step = (2 * Math.PI) / ring.items.length;

                    ring.items.forEach((m, i) => {
                        const angle = step * i;
                        const x = Math.cos(angle) * ring.r;
                        const z = Math.sin(angle) * ring.r;
                        const link = document.createElement('a');
                        link.className = 'planet-link';
                        
                        if(m.isSpecial) {
                            link.href = "#";
                            link.onclick = (e) => { e.preventDefault(); App.deployAI(); App.sfx('click'); };
                        } else {
                            link.href = m.link;
                            link.onclick = () => App.sfx('click');
                        }
                        link.onmouseenter = () => App.sfx('hover');
                        
                        const colorHex = App.getColor(m.color);
                        link.style.transform = `translate3d(${x}px, 0, ${z}px) rotateX(-90deg)`;
                        
                        link.innerHTML = `
                            <div class="planet-body" style="border-color: ${colorHex}; box-shadow: 0 0 15px ${colorHex}; background: #000;"></div>
                            <div class="planet-label" style="border-color: ${colorHex}; color: #fff;">
                                <span style="color:${colorHex}; font-weight:bold; margin-right:4px;">${m.id}</span> ${m.name}
                            </div>
                        `;
                        orbitContainer.appendChild(link);
                    });
                });
            },

            // === GRID BUILDER & FILTER ===
            buildGrid() {
                const grid = document.getElementById('modules-grid');
                grid.innerHTML = ''; // Clear
                this.modules.forEach(m => {
                    const hex = App.getColor(m.color);
                    const card = document.createElement('a');
                    card.className = 'module-card p-6 block group filter-item'; // added class for searching
                    card.setAttribute('data-search', m.name.toLowerCase() + " " + m.desc.toLowerCase() + " " + m.id);
                    card.style.setProperty('--hover-color', hex);
                    card.style.setProperty('--hover-glow', hex + '40');

                    if(m.isSpecial) {
                        card.href = "#";
                        card.onclick = (e) => { e.preventDefault(); App.deployAI(); App.sfx('click'); };
                    } else {
                        card.href = m.link;
                        card.onclick = () => App.sfx('click');
                    }
                    card.onmouseenter = () => App.sfx('hover');

                    card.innerHTML = `
                        <div class="flex justify-between items-center mb-4">
                            <span class="font-mono text-xs font-bold" style="color:${hex}">SYS-${m.id}</span>
                            <div class="w-2 h-2 rounded-full shadow-[0_0_5px_white]" style="background-color:${hex}"></div>
                        </div>
                        <h3 class="text-xl font-divine text-white group-hover:text-[${hex}] transition mb-2">${m.name}</h3>
                        <p class="text-sm text-slate-400 font-light mb-4 h-10">${m.desc}</p>
                        <div class="h-px w-8 bg-white/20 group-hover:w-full transition-all duration-500" style="background-color:${hex}"></div>
                    `;
                    grid.appendChild(card);
                });
            },

            filterGrid() {
                const query = document.getElementById('search-input').value.toLowerCase();
                const cards = document.querySelectorAll('.filter-item');
                cards.forEach(card => {
                    const text = card.getAttribute('data-search');
                    if (text.includes(query)) {
                        card.style.display = "block";
                    } else {
                        card.style.display = "none";
                    }
                });
            },

            // === AI DEPLOY ===
            deployAI() {
                const overlay = document.getElementById('ai-takeover');
                const box = document.getElementById('ai-status-box');
                const bar = document.getElementById('ai-progress-bar');
                const log = document.getElementById('ai-logs');
                const cvs = document.getElementById('matrix-rain-canvas');
                
                overlay.classList.remove('hidden'); overlay.classList.add('flex');
                setTimeout(() => box.classList.remove('scale-0'), 100);
                
                this.runMatrixRain(cvs);
                log.innerHTML = ''; bar.style.width = '0%';
                
                const msgs = ["NEURAL HANDSHAKE...", "BYPASSING FIREWALL...", "OPTIMIZING TOPOLOGY...", "ACCESS GRANTED."];
                msgs.forEach((m, i) => {
                    setTimeout(() => {
                        log.innerHTML = `> ${m}<br>` + log.innerHTML;
                        bar.style.width = `${(i+1)*25}%`;
                        this.sfx('click');
                    }, i*1000 + 500);
                });

                setTimeout(() => {
                    box.classList.add('scale-0');
                    setTimeout(() => { overlay.classList.add('hidden'); overlay.classList.remove('flex'); }, 300);
                }, 5000);
            },

            runMatrixRain(c) {
                const ctx = c.getContext('2d');
                let animationFrameId;
                
                const draw = () => {
                    // Subtle fade effect for trails
                    ctx.fillStyle = 'rgba(0,0,0,0.05)'; 
                    ctx.fillRect(0,0,c.width,c.height);
                    
                    ctx.fillStyle = '#FFD700'; // GOLD MATRIX
                    ctx.font = '14px monospace';
                    ctx.shadowBlur = 0;
                    
                    for(let i=0; i<drops.length; i++) {
                        const text = String.fromCharCode(0x30A0 + Math.random() * 96);
                        ctx.fillText(text, i*20, drops[i]*20);
                        
                        if(drops[i]*20 > c.height && Math.random()>0.975) drops[i]=0;
                        drops[i]++;
                    }
                    animationFrameId = requestAnimationFrame(draw);
                }

                // Setup
                c.width = window.innerWidth; c.height = window.innerHeight;
                const cols = Math.floor(c.width/20); 
                const drops = Array(cols).fill(1);
                
                // Stop previous if any (simple check)
                // Ideally assign animationFrameId to App property to clear it, but this works for now
                
                draw();
            },

            // === BACKGROUND MATRIX (Subtle) ===
            initMatrix() {
                const c = document.getElementById('matrix-canvas');
                const ctx = c.getContext('2d');
                c.width = window.innerWidth; c.height = window.innerHeight;
                const cols = Math.floor(c.width/25); 
                const drops = Array(cols).fill(1);

                const draw = () => {
                    ctx.fillStyle = 'rgba(0,0,0,0.1)'; // More transparent for background
                    ctx.fillRect(0,0,c.width,c.height);
                    ctx.font = '12px monospace';
                    
                    for(let i=0; i<drops.length; i++) {
                        const text = String.fromCharCode(Math.random()*128);
                        const x = i*25; const y = drops[i]*25;
                        
                        // Draw rarely to keep it subtle
                        if(Math.random() > 0.97) {
                            ctx.fillStyle = (Math.random() > 0.5) ? 'rgba(6, 182, 212, 0.3)' : 'rgba(255, 215, 0, 0.3)';
                            ctx.fillText(text, x, y);
                        }
                        if(y > c.height && Math.random() > 0.98) drops[i] = 0;
                        drops[i]++;
                    }
                    requestAnimationFrame(draw);
                }
                draw();
            },

            getColor(cls) {
                const map = {
                    'm-cyan': '#06b6d4', 'm-purple': '#8b5cf6', 'm-orange': '#f97316', 'm-yellow': '#facc15',
                    'm-blue': '#3b82f6', 'm-green': '#10b981', 'm-red': '#ef4444', 'm-magma': '#ff5722',
                    'm-stone': '#78716c', 'm-emerald': '#34d399', 'm-fuchsia': '#d946ef', 'm-gold': '#FFD700'
                };
                return map[cls] || '#fff';
            }
        };

        document.addEventListener('DOMContentLoaded', () => App.init());
    </script>
</body>
</html>
