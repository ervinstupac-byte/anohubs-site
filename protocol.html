<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnoHUB | TITAN PROTOCOL v35.0</title>
    <meta name="description" content="The central index of AnoHUB's 23 engineering protocols. Access the full matrix of hydro integrity modules.">
    
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "CollectionPage",
      "name": "TITAN PROTOCOL v35.0",
      "description": "Centralized index of 23 engineering and operational protocols.",
      "provider": { "@type": "Organization", "name": "AnoHUB" }
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=JetBrains+Mono:wght@300;500;800&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { 
            theme: { 
                extend: { 
                    fontFamily: { 
                        sans: ['Rajdhani', 'sans-serif'], 
                        mono: ['JetBrains Mono', 'monospace'],
                        divine: ['Cinzel', 'serif'] 
                    },
                    colors: { 
                        'h-gold': '#FFD700', 'h-void': '#030303', 
                        'm-cyan': '#06b6d4', 'm-purple': '#8b5cf6', 'm-orange': '#f97316', 'm-yellow': '#facc15',
                        'm-blue': '#3b82f6', 'm-green': '#10b981', 'm-red': '#ef4444', 'm-magma': '#ff5722',
                        'm-stone': '#78716c', 'm-emerald': '#34d399', 'm-fuchsia': '#d946ef'
                    },
                    animation: { 
                        'spin-orbit': 'spin 120s linear infinite', 
                        'pulse-glow': 'pulseGlow 3s infinite',
                        'heartbeat': 'heartbeat 3s ease-in-out infinite'
                    },
                    keyframes: {
                        pulseGlow: { '0%, 100%': { boxShadow: '0 0 30px rgba(255, 215, 0, 0.2)' }, '50%': { boxShadow: '0 0 80px rgba(255, 215, 0, 0.6)' } },
                        heartbeat: { '0%, 100%': { transform: 'scale(1)', opacity: '1' }, '50%': { transform: 'scale(1.1)', opacity: '0.8' } }
                    }
                } 
            }
        }
    </script>

    <style>
        body { background-color: #000; color: #e2e8f0; overflow-x: hidden; cursor: crosshair; }
        
        /* === BACKGROUND LAYERS === */
        
        /* 1. IMAGE LAYER (prtcl.jpg) */
        .bg-layer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            z-index: -3;
            background-image: url('slike/prtcl.jpg'); 
            background-size: cover; background-position: center;
            opacity: 0.35; 
            filter: grayscale(100%) contrast(1.4) brightness(0.6); /* Cinematic Dark Mode */
        }

        /* 2. MATRIX RAIN CANVAS */
        .matrix-canvas { position: fixed; inset: 0; z-index: -2; opacity: 0.15; pointer-events: none; mix-blend-mode: screen; }
        
        /* 3. GRID OVERLAY */
        .holy-grid {
            position: fixed; inset: 0; z-index: -1;
            background-image: linear-gradient(rgba(255, 215, 0, 0.05) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255, 215, 0, 0.05) 1px, transparent 1px);
            background-size: 100px 100px;
            mask-image: radial-gradient(circle at 50% 50%, black 20%, transparent 100%);
            pointer-events: none;
        }

        /* === 3D SOLAR SYSTEM === */
        .universe-container {
            height: 100vh; width: 100%;
            display: flex; align-items: center; justify-content: center;
            perspective: 1200px; position: relative; z-index: 10;
            overflow: hidden;
        }

        #galaxy {
            position: relative; width: 0; height: 0;
            transform-style: preserve-3d;
            animation: spin-orbit 120s linear infinite;
        }
        
        .universe-container:hover #galaxy { animation-play-state: paused; }

        /* Planet Links (The Modules) */
        .planet-link {
            position: absolute; top: 50%; left: 50%;
            width: 60px; height: 60px; margin-left: -30px; margin-top: -30px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transform-style: preserve-3d; cursor: pointer; text-decoration: none;
            z-index: 100;
        }

        /* Counter-rotate to keep text upright */
        .planet-content {
            animation: spin-orbit 120s linear infinite reverse;
            text-align: center; transition: all 0.3s ease;
            display: flex; flex-direction: column; align-items: center;
        }
        .universe-container:hover .planet-content { animation-play-state: paused; }

        .planet-core {
            width: 12px; height: 12px; background: #000; border: 2px solid; border-radius: 50%;
            box-shadow: 0 0 15px currentColor; transition: all 0.3s;
        }

        .planet-label {
            margin-top: 8px; font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: bold;
            color: rgba(255,255,255,0.7); background: rgba(0,0,0,0.8); padding: 2px 6px; border-radius: 4px;
            border: 1px solid #333; white-space: nowrap; transition: all 0.3s; pointer-events: none;
        }

        .planet-link:hover { z-index: 1000; }
        .planet-link:hover .planet-core { transform: scale(2.0); background: white; border-color: white !important; box-shadow: 0 0 40px white; }
        .planet-link:hover .planet-label { color: #FFD700; border-color: #FFD700; transform: scale(1.2); opacity: 1; }

        /* THE SUN (CENTER) */
        .sun {
            position: absolute; width: 140px; height: 140px;
            background: radial-gradient(circle, #fff 0%, #FFD700 60%, transparent 100%);
            border-radius: 50%; transform: translate(-50%, -50%);
            box-shadow: 0 0 100px rgba(255, 215, 0, 0.4);
            display: flex; align-items: center; justify-content: center;
            font-family: 'Cinzel', serif; font-weight: 900; color: black; font-size: 48px;
            pointer-events: none; z-index: 10;
        }

        /* GRID CARDS */
        .module-card {
            background: linear-gradient(180deg, rgba(20,20,20,0.9) 0%, rgba(5,5,5,1) 100%);
            border: 1px solid rgba(255,255,255,0.1); transition: all 0.3s ease;
        }
        .module-card:hover { transform: translateY(-5px); border-color: var(--hover-color); box-shadow: 0 0 30px var(--hover-glow); }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #FFD700; }
    </style>
</head>
<body>

    <div class="bg-layer"></div>
    <canvas id="matrix-bg" class="matrix-canvas"></canvas>
    <div class="holy-grid"></div>

    <div class="fixed top-0 left-0 w-full z-50 bg-gradient-to-b from-black/90 to-transparent pointer-events-none">
        <div class="p-6 flex justify-between items-start pointer-events-auto">
            <a href="index.html" class="group block">
                <h1 class="text-4xl md:text-5xl font-divine text-white tracking-[0.15em] drop-shadow-lg group-hover:text-h-gold transition">AnoHUB</h1>
                <div class="h-0.5 w-12 bg-h-gold mt-2 group-hover:w-24 transition-all duration-500"></div>
                <p class="text-[10px] font-mono text-h-gold mt-1 uppercase tracking-widest">Protocol Index v35.0</p>
            </a>
            <div class="text-right hidden md:block pointer-events-auto">
                <div class="text-[10px] font-mono text-slate-400">SYSTEM STATUS</div>
                <div class="text-xl font-divine text-m-green animate-pulse">OPTIMAL</div>
            </div>
        </div>
    </div>

    <div class="universe-container">
        <div id="galaxy">
            <div class="sun animate-heartbeat">A</div>
            </div>

        <div class="absolute bottom-8 text-center w-full animate-bounce pointer-events-auto cursor-pointer z-50" onclick="document.getElementById('full-matrix').scrollIntoView({behavior: 'smooth'})">
            <p class="text-[10px] font-mono text-h-gold mb-2 tracking-[0.3em] uppercase">Access Full Matrix</p>
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFD700" stroke-width="2" class="mx-auto"><path d="m7 13 5 5 5-5"/><path d="m7 6 5 5 5-5"/></svg>
        </div>
    </div>

    <section id="full-matrix" class="relative z-10 bg-black/90 border-t border-h-gold/20 py-24 px-6 min-h-screen backdrop-blur-sm">
        <div class="max-w-7xl mx-auto">
            <div class="flex items-center gap-4 mb-16">
                <div class="w-2 h-10 bg-h-gold shadow-[0_0_20px_#FFD700]"></div>
                <div>
                    <h2 class="text-3xl md:text-4xl font-divine text-white tracking-[0.1em]">PROTOCOL INDEX</h2>
                    <p class="text-xs font-mono text-slate-500">23 ACTIVE ENGINEERING MODULES</p>
                </div>
            </div>
            <div id="modules-grid" class="grid md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>
        </div>
    </section>

    <div id="ai-takeover" class="fixed inset-0 z-[9999] bg-black hidden flex-col items-center justify-center">
        <canvas id="matrix-overlay" class="absolute inset-0 w-full h-full"></canvas>
        <div class="absolute inset-0 flex flex-col items-center justify-center z-20 pointer-events-none">
            <div id="ai-box" class="bg-black/95 border border-h-gold p-12 text-center backdrop-blur-xl shadow-[0_0_150px_rgba(255,215,0,0.3)] transform scale-0 transition-transform duration-500 rounded-lg">
                <h1 class="text-6xl font-black text-white tracking-tighter mb-4 font-divine">OMNISCIENCE</h1>
                <div class="text-h-gold font-mono text-sm animate-pulse">ESTABLISHING NEURAL HANDSHAKE...</div>
                <div class="w-full h-1 bg-slate-800 mt-8 rounded overflow-hidden"><div id="ai-bar" class="h-full bg-h-gold w-0 transition-all duration-300 ease-out"></div></div>
                <div id="ai-log" class="mt-6 font-mono text-[10px] text-slate-400 h-24 overflow-hidden text-left space-y-1 border-t border-slate-800 pt-4 opacity-70"></div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <script>
        const App = {
            // === TVOJ SVETI POPIS MODULA (23 + 1 AI) ===
            modules: [
                { id: '01', name: 'Protocol Core', link: 'protocol/anohub_protocol_v2.html', color: '#06b6d4', desc: 'Base LCC Veto Logic.' },
                { id: '02', name: 'NDT Metrology', link: 'protocol/anohub_methodology_v2.html', color: '#8b5cf6', desc: 'Deep-scan verification.' },
                { id: '03', name: 'Org Intelligence', link: 'protocol/anohub_organization_v2.html', color: '#f97316', desc: 'Governance models.' },
                { id: '04', name: 'M-E Synergy', link: 'protocol/anohub_synergy_v2.html', color: '#facc15', desc: 'Electro-mech harmonics.' },
                { id: '05', name: 'Alignment', link: 'protocol/anohub_alignment_v2.html', color: '#3b82f6', desc: 'Precision centering.' },
                { id: '06', name: 'Predictive AI', link: 'protocol/anohub_predictive_v2.html', color: '#10b981', desc: 'RUL forecasting.' },
                { id: '07', name: 'Fluid Dynamics', link: 'protocol/anohub_fluid_v2.html', color: '#06b6d4', desc: 'CFD flow analysis.' },
                { id: '08', name: 'Mag Flux', link: 'protocol/anohub_flux_v2.html', color: '#ff5722', desc: 'Air gap monitoring.' },
                { id: '09', name: 'Cost Opt', link: 'protocol/anohub_cost_v2.html', color: '#10b981', desc: 'Arbitrage & inventory.' },
                { id: '10', name: 'Flood Gate', link: 'protocol/anohub_flood_v2.html', color: '#3b82f6', desc: 'Spillway control.' },
                { id: '11', name: 'Vib Damp', link: 'protocol/anohub_vib_v2.html', color: '#d946ef', desc: 'Active cancellation.' },
                { id: '12', name: 'Dam Struct', link: 'protocol/anohub_dam_v2.html', color: '#78716c', desc: 'Stability & uplift.' },
                { id: '13', name: 'Sat Uplink', link: 'protocol/anohub_sat_v2.html', color: '#06b6d4', desc: 'Geospatial data.' },
                { id: '14', name: 'SCADA Logs', link: 'protocol/anohub_scada_v2.html', color: '#f97316', desc: 'Data recording.' },
                { id: '15', name: 'SCADA OVR', link: 'protocol/anohub_scada_override_v2.html', color: '#ef4444', desc: 'Security override.' },
                { id: '16', name: 'Asset Life', link: 'protocol/anohub_asset_v2.html', color: '#34d399', desc: 'Lifecycle mgmt.' },
                { id: '17', name: 'ISO Audit', link: 'protocol/anohub_iso_v2.html', color: '#FFD700', desc: 'IMS compliance.' },
                { id: '18', name: 'Global Link', link: 'protocol/anohub_global_v2.html', color: '#3b82f6', desc: 'Grid connection.' },
                { id: '19', name: 'Quantum Load', link: 'protocol/anohub_quantum_v2.html', color: '#a855f7', desc: 'Optimization algo.' },
                { id: '20', name: 'Thermal AI', link: 'protocol/anohub_thermal_v2.html', color: '#ef4444', desc: 'Hotspot detection.' },
                { id: '21', name: 'Core Temp', link: 'protocol/anohub_core_v2.html', color: '#ff5722', desc: 'Stator integrity.' },
                { id: '22', name: 'Turbine Sync', link: 'protocol/anohub_sync_v2.html', color: '#facc15', desc: 'Grid synchronization.' }, 
                { id: '23', name: 'Cavitation Logic', link: 'protocol/anohub_cavitation_v2.html', color: '#06b6d4', desc: 'Erosion prevention.' },
                { id: '99', name: 'AI Core', link: '#', color: '#FFD700', desc: 'Central Intelligence.', isSpecial: true }
            ],

            init() {
                this.buildSolarSystem();
                this.buildGrid();
                this.initMatrix('matrix-bg', '#0F0'); 
                lucide.createIcons();
            },

            buildSolarSystem() {
                const system = document.getElementById('galaxy');
                // 3 Prstena modula
                const rings = [
                    { r: 200, speed: 30, items: this.modules.slice(0, 8) },   
                    { r: 320, speed: 50, items: this.modules.slice(8, 16) },  
                    { r: 450, speed: 80, items: this.modules.slice(16, 24) } 
                ];

                rings.forEach((ring, idx) => {
                    const orbitContainer = document.createElement('div');
                    Object.assign(orbitContainer.style, {
                        position: 'absolute', top: '50%', left: '50%', width: '0', height: '0',
                        transformStyle: 'preserve-3d', animation: `spin-orbit ${ring.speed}s linear infinite`,
                        pointerEvents: 'none'
                    });
                    if(idx % 2 !== 0) orbitContainer.style.animationDirection = 'reverse';
                    
                    system.appendChild(orbitContainer);

                    const step = (2 * Math.PI) / ring.items.length;

                    ring.items.forEach((m, i) => {
                        const angle = step * i;
                        const x = Math.cos(angle) * ring.r;
                        const z = Math.sin(angle) * ring.r;

                        const link = document.createElement('a');
                        link.className = 'planet-link';
                        
                        if(m.isSpecial) {
                            link.href = "#"; link.onclick = (e) => { e.preventDefault(); App.deployAI(); };
                        } else {
                            link.href = m.link;
                        }
                        
                        link.style.transform = `translate3d(${x}px, 0, ${z}px) rotateX(-90deg)`;
                        link.innerHTML = `
                            <div class="planet-content">
                                <div class="planet-core" style="border-color: ${m.color}; box-shadow: 0 0 15px ${m.color}"></div>
                                <div class="planet-label" style="border-color: ${m.color}">
                                    <span style="color:${m.color}; margin-right:4px;">${m.id}</span> ${m.name}
                                </div>
                            </div>
                        `;
                        orbitContainer.appendChild(link);
                    });
                });
            },

            buildGrid() {
                const grid = document.getElementById('modules-grid');
                this.modules.forEach(m => {
                    if (m.id === '99') return; 
                    const card = document.createElement('a');
                    card.className = 'module-card p-6 block group rounded';
                    card.style.setProperty('--hover-color', m.color);
                    card.style.setProperty('--hover-glow', m.color + '40');
                    card.href = m.link;
                    card.innerHTML = `
                        <div class="flex justify-between items-center mb-4">
                            <span class="font-mono text-xs font-bold opacity-70" style="color:${m.color}">SYS-${m.id}</span>
                            <div class="w-1.5 h-1.5 rounded-full shadow-[0_0_5px_white]" style="background-color:${m.color}"></div>
                        </div>
                        <h3 class="text-xl font-divine text-white group-hover:text-[${m.color}] transition mb-2">${m.name}</h3>
                        <p class="text-xs text-slate-400 font-light mb-4">${m.desc}</p>
                        <div class="h-0.5 w-8 bg-white/20 group-hover:w-full transition-all duration-500" style="background-color:${m.color}"></div>
                    `;
                    grid.appendChild(card);
                });
            },

            deployAI() {
                const overlay = document.getElementById('ai-takeover');
                const bar = document.getElementById('ai-bar');
                const log = document.getElementById('ai-log');
                overlay.classList.remove('hidden'); overlay.classList.add('flex');
                setTimeout(() => document.getElementById('ai-box').classList.remove('scale-0'), 100);
                this.initMatrix('matrix-overlay', '#FFD700'); 
                log.innerHTML = ''; bar.style.width = '0%';
                
                const msgs = ["NEURAL HANDSHAKE...", "BYPASSING FIREWALL...", "OPTIMIZING TOPOLOGY...", "ACCESS GRANTED."];
                msgs.forEach((m, i) => setTimeout(() => {
                    log.innerHTML = `> ${m}<br>` + log.innerHTML;
                    bar.style.width = `${(i+1)*25}%`;
                }, i*1000 + 500));

                setTimeout(() => {
                    document.getElementById('ai-box').classList.add('scale-0');
                    setTimeout(() => { overlay.classList.add('hidden'); overlay.classList.remove('flex'); }, 300);
                }, 5000);
            },

            initMatrix(canvasId, color) {
                const c = document.getElementById(canvasId);
                if(!c) return;
                const ctx = c.getContext('2d');
                c.width = window.innerWidth; c.height = window.innerHeight;
                const cols = Math.floor(c.width/20); const drops = Array(cols).fill(1);
                setInterval(() => {
                    ctx.fillStyle = 'rgba(0,0,0,0.05)'; ctx.fillRect(0,0,c.width,c.height);
                    ctx.fillStyle = color; ctx.font = '14px monospace';
                    for(let i=0; i<drops.length; i++) {
                        const text = String.fromCharCode(Math.random()*128);
                        ctx.fillText(text, i*20, drops[i]*20);
                        if(drops[i]*20 > c.height && Math.random()>0.975) drops[i]=0;
                        drops[i]++;
                    }
                }, 35);
            }
        };

        document.addEventListener('DOMContentLoaded', () => App.init());
    </script>
</body>
</html>
