<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnoHUB | ARCHITECT INTERFACE v28.0</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=JetBrains+Mono:wght@200;400;800&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { 
            theme: { 
                extend: { 
                    fontFamily: { sans: ['Rajdhani', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'], divine: ['Cinzel', 'serif'] },
                    colors: { 
                        'h-gold': '#FFD700', 'h-void': '#050505', 
                        // Module Colors
                        'm-cyan': '#06b6d4', 'm-purple': '#8b5cf6', 'm-orange': '#f97316', 'm-yellow': '#facc15',
                        'm-blue': '#3b82f6', 'm-green': '#10b981', 'm-red': '#ef4444', 'm-magma': '#ff5722',
                        'm-stone': '#78716c', 'm-emerald': '#34d399', 'm-fuchsia': '#d946ef'
                    },
                    animation: { 'spin-orbit': 'spin 60s linear infinite', 'pulse-glow': 'pulseGlow 3s infinite' },
                    keyframes: {
                        pulseGlow: { '0%, 100%': { boxShadow: '0 0 20px #FFD700' }, '50%': { boxShadow: '0 0 60px #FFD700' } }
                    }
                } 
            }
        }
    </script>

    <style>
        body { background-color: #000; color: #e2e8f0; overflow-x: hidden; cursor: crosshair; }
        
        /* MATRIX LAYER (POJAČANO) */
        .matrix-layer { 
            position: fixed; inset: 0; z-index: -2; opacity: 0.3; pointer-events: none; 
            mix-blend-mode: screen;
        }

        /* 3D SCENE */
        .universe {
            position: relative; height: 90vh; width: 100%;
            display: flex; align-items: center; justify-content: center;
            perspective: 1000px; overflow: hidden;
        }

        /* ATOMIC RINGS SYSTEM */
        .solar-system {
            position: relative; width: 0; height: 0;
            transform-style: preserve-3d;
            transform: rotateX(20deg); /* Tilt for better view */
        }

        .orbit-ring {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            transform-style: preserve-3d;
        }

        /* THE PLANET (MODULE) */
        .planet-link {
            position: absolute; top: 50%; left: 50%;
            width: 40px; height: 40px;
            margin-left: -20px; margin-top: -20px;
            display: flex; align-items: center; justify-content: center;
            transform-style: preserve-3d;
            cursor: pointer; text-decoration: none;
            /* KLJUČNO ZA KLIKOVE */
            pointer-events: auto !important; 
            z-index: 100;
        }

        .planet-body {
            width: 16px; height: 16px; border-radius: 50%;
            background: black; border: 2px solid;
            box-shadow: 0 0 15px currentColor;
            transition: all 0.3s ease;
        }

        .planet-label {
            position: absolute; top: 25px; left: 50%; transform: translateX(-50%);
            font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: bold;
            color: white; background: rgba(0,0,0,0.8); padding: 2px 6px; border-radius: 4px;
            border: 1px solid #333; white-space: nowrap; opacity: 0.7; transition: all 0.3s;
            pointer-events: none;
        }

        .planet-link:hover .planet-body { transform: scale(2.5); background: white; box-shadow: 0 0 40px white; border-color: white !important; }
        .planet-link:hover .planet-label { opacity: 1; transform: translateX(-50%) scale(1.2); border-color: white; color: #FFD700; }

        /* CENTER SUN */
        .sun {
            position: absolute; width: 80px; height: 80px;
            background: radial-gradient(circle, #fff, #FFD700);
            border-radius: 50%; transform: translate(-50%, -50%);
            box-shadow: 0 0 80px #FFD700;
            z-index: 10; display: flex; align-items: center; justify-content: center;
            font-family: 'Cinzel', serif; font-weight: 900; color: black; font-size: 24px;
        }

        /* GRID CARDS */
        .module-card {
            background: linear-gradient(180deg, rgba(10,10,10,0.9) 0%, rgba(5,5,5,1) 100%);
            border: 1px solid rgba(255,255,255,0.15);
            transition: all 0.2s ease;
        }
        .module-card:hover { transform: translateY(-5px); border-color: var(--hover-color); box-shadow: 0 0 30px var(--hover-glow); }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: #FFD700; }
    </style>
</head>
<body>

    <canvas id="matrix-canvas" class="matrix-layer"></canvas>

    <div class="fixed top-0 left-0 w-full z-50 p-6 flex justify-between items-start bg-gradient-to-b from-black to-transparent pointer-events-none">
        <div class="pointer-events-auto">
            <a href="index.html" class="group block">
                <h1 class="text-4xl font-divine text-white tracking-[0.2em] drop-shadow-[0_0_10px_rgba(255,255,255,0.5)] group-hover:text-h-gold transition">AnoHUB</h1>
                <div class="h-0.5 w-12 bg-h-gold mt-1 mb-1 group-hover:w-32 transition-all duration-500"></div>
                <p class="text-[10px] font-mono text-h-gold">PROTOCOL MATRIX v28.0</p>
            </a>
        </div>
        <div class="text-right">
            <div class="text-[10px] font-mono text-slate-500">SECURE LINK</div>
            <div class="text-lg font-divine text-h-green animate-pulse">ESTABLISHED</div>
        </div>
    </div>

    <div class="universe">
        <div class="solar-system" id="solar-system">
            <div class="sun animate-pulse-glow">A</div>
            
            </div>

        <div class="absolute bottom-10 text-center w-full animate-bounce pointer-events-none text-slate-500 font-mono text-xs">
            SCROLL FOR LIST VIEW ▼
        </div>
    </div>

    <section id="full-matrix" class="relative z-10 bg-black border-t border-h-gold/30 py-20 px-6 min-h-screen">
        <div class="max-w-7xl mx-auto">
            <div class="flex items-center gap-4 mb-12">
                <div class="w-2 h-8 bg-h-gold"></div>
                <h2 class="text-3xl font-divine text-white tracking-[0.2em]">PROTOCOL INDEX</h2>
            </div>
            <div id="modules-grid" class="grid md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>
        </div>
    </section>

    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <script>
        const App = {
            // === CONFIGURATION ===
            modules: [
                { id: '01', name: 'LCC Veto', link: 'protocol/anohub_protocol_v2.html', color: '#06b6d4' },
                { id: '02', name: 'NDT Metrology', link: 'protocol/anohub_methodology_v2.html', color: '#8b5cf6' },
                { id: '03', name: 'Org Intelligence', link: 'protocol/anohub_organization_v2.html', color: '#f97316' },
                { id: '04', name: 'M-E Synergy', link: 'protocol/anohub_synergy_v2.html', color: '#facc15' },
                { id: '05', name: 'Alignment', link: 'protocol/anohub_alignment_v2.html', color: '#3b82f6' },
                { id: '06', name: 'Predictive AI', link: 'protocol/anohub_predictive_v2.html', color: '#10b981' },
                { id: '07', name: 'Fluid Dynamics', link: 'protocol/anohub_fluid_v2.html', color: '#06b6d4' },
                { id: '08', name: 'Mag Flux', link: 'protocol/anohub_flux_v2.html', color: '#ff5722' },
                { id: '09', name: 'Cost Opt', link: 'protocol/anohub_cost_v2.html', color: '#10b981' },
                { id: '10', name: 'Flood Gate', link: 'protocol/anohub_flood_v2.html', color: '#3b82f6' },
                { id: '11', name: 'Vib Damp', link: 'protocol/anohub_vib_v2.html', color: '#d946ef' },
                { id: '12', name: 'Dam Struct', link: 'protocol/anohub_dam_v2.html', color: '#78716c' },
                { id: '13', name: 'Sat Uplink', link: 'protocol/anohub_sat_v2.html', color: '#06b6d4' },
                { id: '14', name: 'Black Box', link: 'protocol/anohub_blackbox_v2.html', color: '#f97316' },
                { id: '15', name: 'SCADA OVR', link: 'protocol/anohub_scada_v2.html', color: '#ef4444' },
                { id: '16', name: 'Asset Life', link: 'protocol/anohub_asset_v2.html', color: '#34d399' },
                { id: '17', name: 'ISO Audit', link: 'protocol/anohub_iso_v2.html', color: '#FFD700' },
                { id: '18', name: 'Global Link', link: 'protocol/anohub_global_v2.html', color: '#3b82f6' },
                { id: '19', name: 'Quantum Load', link: 'protocol/anohub_quantum_v2.html', color: '#a855f7' },
                { id: '20', name: 'Thermal AI', link: 'protocol/anohub_thermal_v2.html', color: '#ef4444' },
                { id: '21', name: 'Core Temp', link: 'protocol/anohub_core_v2.html', color: '#ff5722' }
            ],

            init() {
                this.buildSolarSystem();
                this.buildGrid();
                this.initMatrix();
                lucide.createIcons();
            },

            // === 1. ORBITAL SYSTEM BUILDER ===
            buildSolarSystem() {
                const system = document.getElementById('solar-system');
                
                // Divide modules into 3 rings
                const rings = [
                    { r: 250, speed: 20, items: this.modules.slice(0, 7) },   // Inner
                    { r: 400, speed: 35, items: this.modules.slice(7, 14) },  // Middle
                    { r: 550, speed: 50, items: this.modules.slice(14, 21) }  // Outer
                ];

                rings.forEach((ring, ringIndex) => {
                    // Create Ring Visual
                    const ringDiv = document.createElement('div');
                    ringDiv.className = 'orbit-ring';
                    ringDiv.style.width = (ring.r * 2) + 'px';
                    ringDiv.style.height = (ring.r * 2) + 'px';
                    // Rotate ring slightly for 3D effect
                    ringDiv.style.transform = `translate(-50%, -50%) rotateX(60deg)`; 
                    system.appendChild(ringDiv);

                    // Create Container for Rotating Planets
                    const orbitContainer = document.createElement('div');
                    orbitContainer.style.position = 'absolute';
                    orbitContainer.style.top = '50%'; orbitContainer.style.left = '50%';
                    orbitContainer.style.width = '0'; orbitContainer.style.height = '0';
                    orbitContainer.style.transformStyle = 'preserve-3d';
                    orbitContainer.style.animation = `spin-orbit ${ring.speed}s linear infinite`;
                    // Reverse alternate rings for visual complexity
                    if (ringIndex % 2 !== 0) orbitContainer.style.animationDirection = 'reverse';
                    
                    system.appendChild(orbitContainer);

                    // Place Planets
                    const step = (2 * Math.PI) / ring.items.length;
                    
                    ring.items.forEach((m, i) => {
                        const angle = step * i;
                        const x = Math.cos(angle) * ring.r;
                        const z = Math.sin(angle) * ring.r; // Use Z for depth in 3D space

                        const link = document.createElement('a');
                        link.href = m.link;
                        link.className = 'planet-link';
                        // Counter-rotate to keep text legible? No, let them fly free in 3D
                        // We use X and Z to place them on the "floor" plane
                        link.style.transform = `translate3d(${x}px, 0, ${z}px) rotateX(-90deg)`; 
                        // rotateX(-90deg) makes them stand up facing camera if the ring is flat
                        
                        link.innerHTML = `
                            <div class="planet-body" style="border-color: ${m.color}; box-shadow: 0 0 10px ${m.color}"></div>
                            <div class="planet-label" style="border-color: ${m.color}">${m.id} ${m.name}</div>
                        `;
                        
                        orbitContainer.appendChild(link);
                    });
                });
            },

            // === 2. GRID BUILDER ===
            buildGrid() {
                const grid = document.getElementById('modules-grid');
                this.modules.forEach(m => {
                    const card = document.createElement('a');
                    card.href = m.link;
                    card.className = 'module-card p-6 block group';
                    card.style.setProperty('--hover-color', m.color);
                    card.style.setProperty('--hover-glow', m.color + '40');

                    card.innerHTML = `
                        <div class="flex justify-between items-center mb-4">
                            <span class="font-mono text-xs" style="color:${m.color}">SYS-${m.id}</span>
                            <div class="w-2 h-2 rounded-full" style="background-color:${m.color}; box-shadow: 0 0 10px ${m.color}"></div>
                        </div>
                        <h3 class="text-xl font-divine text-white group-hover:text-[${m.color}] transition mb-2">${m.name}</h3>
                        <div class="h-px w-8 bg-white/20 group-hover:w-full transition-all duration-500" style="background-color:${m.color}"></div>
                    `;
                    grid.appendChild(card);
                });
            },

            // === 3. VISIBLE MATRIX ===
            initMatrix() {
                const c = document.getElementById('matrix-canvas');
                const ctx = c.getContext('2d');
                c.width = window.innerWidth; c.height = window.innerHeight;
                
                const cols = Math.floor(c.width/20);
                const drops = Array(cols).fill(1);

                setInterval(() => {
                    ctx.fillStyle = 'rgba(0,0,0,0.1)'; // Faster fade for clearer text
                    ctx.fillRect(0,0,c.width,c.height);
                    
                    ctx.fillStyle = '#0F0'; // Bright Green
                    ctx.font = '12px monospace';
                    ctx.shadowBlur = 5; // GLOW EFFECT
                    ctx.shadowColor = '#0F0';

                    for(let i=0; i<drops.length; i++) {
                        const text = String.fromCharCode(0x30A0 + Math.random() * 96); // Matrix Katakana
                        ctx.fillText(text, i*20, drops[i]*20);
                        if(drops[i]*20 > c.height && Math.random() > 0.975) drops[i]=0;
                        drops[i]++;
                    }
                }, 40);
            }
        };

        document.addEventListener('DOMContentLoaded', () => App.init());
    </script>
</body>
</html>
