<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnoHUB | PROTOCOL SYSTEM</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&family=Roboto+Mono:wght@300;400;700&display=swap"
        rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <link rel="stylesheet" href="assets/css/preloader.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { mono: ['Roboto Mono', 'monospace'], header: ['Oswald', 'sans-serif'] },
                    colors: { 'h-gold': '#FFB800', 'h-cyan': '#06b6d4' }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #020617;
            color: white;
            overflow: hidden;
            height: 100vh;
            margin: 0;
        }

        /* === KEYFRAMES === */
        @keyframes spin-orbit {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        @keyframes counter-spin {
            from {
                transform: rotate(360deg);
            }

            to {
                transform: rotate(0deg);
            }
        }

        /* === MATRIX BACKGROUND === */
        .matrix-bg {
            position: fixed;
            inset: 0;
            z-index: -2;
            background-image:
                linear-gradient(rgba(6, 182, 212, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(6, 182, 212, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            mask-image: radial-gradient(circle at center, black 40%, transparent 100%);
        }

        .stars {
            position: fixed;
            inset: 0;
            z-index: -3;
            background-image: radial-gradient(white, rgba(255, 255, 255, .1) 1px, transparent 2px);
            background-size: 300px 300px;
            opacity: 0.3;
        }

        /* === SYSTEM CORE === */
        #solar-system {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 1000px;
            height: 1000px;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            /* Let clicks pass to planets */
        }

        .core-sun-wrapper {
            position: absolute;
            pointer-events: auto;
            z-index: 20;
        }

        .core-sun {
            width: 140px;
            height: 140px;
            border: 2px solid #FFB800;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Oswald', sans-serif;
            font-weight: 700;
            font-size: 60px;
            color: #FFB800;
            box-shadow: 0 0 60px rgba(255, 184, 0, 0.2), inset 0 0 20px rgba(255, 184, 0, 0.1);
            background: rgba(0, 0, 0, 0.8);
            transition: all 0.5s;
            text-decoration: none;
        }

        /* PLANET STYLES (Dynamic) */
        .planet-link {
            position: absolute;
            width: 0;
            height: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
        }

        .planet-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            animation: counter-spin inherit linear infinite;
            /* Inherit duration from parent orbit */
        }

        .planet-core {
            width: 12px;
            height: 12px;
            background: #020617;
            border: 2px solid;
            margin-bottom: 10px;
            transform: rotate(45deg);
            transition: all 0.3s;
        }

        .planet-link:hover .planet-core {
            background: #FFB800;
            border-color: #FFB800 !important;
            box-shadow: 0 0 20px #FFB800;
            transform: rotate(45deg) scale(1.5);
        }

        .planet-label {
            font-family: 'Roboto Mono', monospace;
            font-size: 10px;
            letter-spacing: 1px;
            text-transform: uppercase;
            background: rgba(0, 0, 0, 0.8);
            padding: 2px 6px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #64748b;
            white-space: nowrap;
        }

        .planet-link:hover .planet-label {
            color: #06b6d4;
            border-color: #06b6d4;
            text-shadow: 0 0 5px #06b6d4;
        }

        /* === SEARCH UI === */
        #search-ui {
            position: fixed;
            top: 120px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 50;
            width: 300px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #FFB800;
        }

        #search-input {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: #FFB800;
            font-family: 'Oswald', sans-serif;
            font-size: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
            padding: 10px;
        }

        /* === AI OVERLAY === */
        #ai-takeover {
            display: none;
        }

        /* Hidden by default */
    </style>
</head>

<body>
    <div id="global-header"></div>
    <div class="matrix-bg"></div>
    <div class="stars"></div>

    <div id="search-ui">
        <input type="text" id="search-input" placeholder="INITIATE SEARCH..." autocomplete="off">
    </div>

    <div id="solar-system">
        <div class="core-sun-wrapper">
            <a href="index.html" class="core-sun">A</a>
        </div>
        <!-- Rings Injected Here -->
        <div id="galaxy"></div>
    </div>

    <!-- Scripts -->
    <script src="assets/js/layout-loader.js"></script>
    <script>
        const App = {
            modules: [
                { id: '01', name: 'Protocol Core', link: 'protocol/anohub_protocol_v2.html', color: '#06b6d4' },
                { id: '02', name: 'NDT Metrology', link: 'protocol/anohub_methodology_v2.html', color: '#8b5cf6' },
                { id: '03', name: 'Org Intelligence', link: 'protocol/anohub_organization_v2.html', color: '#f97316' },
                { id: '04', name: 'M-E Synergy', link: 'protocol/anohub_synergy_v2.html', color: '#facc15' },
                { id: '05', name: 'Alignment', link: 'protocol/anohub_alignment_v2.html', color: '#3b82f6' },
                { id: '06', name: 'Predictive AI', link: 'protocol/anohub_predictive_v2.html', color: '#10b981' },
                { id: '07', name: 'Fluid Dynamics', link: 'protocol/anohub_fluid_v2.html', color: '#06b6d4' },
                { id: '08', name: 'Mag Flux', link: 'protocol/anohub_flux_v2.html', color: '#ff5722' },
                { id: '09', name: 'Cost Opt', link: 'protocol/anohub_cost_v2.html', color: '#10b981' },
                { id: '10', name: 'Flood Gate', link: 'protocol/anohub_flood_v2.html', color: '#3b82f6' },
                { id: '11', name: 'Vibration Auth', link: 'protocol/anohub_vibration_v3.html', color: '#d946ef' }, // Updated Link
                { id: '12', name: 'Dam Struct', link: 'protocol/anohub_dam_v2.html', color: '#78716c' },
                { id: '13', name: 'Sat Uplink', link: 'protocol/anohub_sat_v2.html', color: '#06b6d4' },
                { id: '14', name: 'SCADA Logs', link: 'protocol/anohub_scada_v2.html', color: '#f97316' },
                { id: '15', name: 'SCADA OVR', link: 'protocol/anohub_scada_override_v2.html', color: '#ef4444' },
                { id: '16', name: 'Asset Life', link: 'protocol/anohub_asset_v2.html', color: '#34d399' },
                { id: '17', name: 'ISO Audit', link: 'protocol/anohub_iso_v2.html', color: '#FFD700' },
                { id: '18', name: 'Global Link', link: 'protocol/anohub_global_v2.html', color: '#3b82f6' },
                { id: '19', name: 'Quantum Load', link: 'protocol/anohub_quantum_v2.html', color: '#a855f7' },
                { id: '20', name: 'Thermal AI', link: 'protocol/anohub_thermal_v2.html', color: '#ef4444' },
                { id: '21', name: 'Core Temp', link: 'protocol/anohub_core_v2.html', color: '#ff5722' },
                { id: '22', name: 'Turbine Sync', link: 'protocol/anohub_sync_v2.html', color: '#facc15' },
                { id: '23', name: 'Cavitation Logic', link: 'protocol/anohub_cavitation_v2.html', color: '#06b6d4' },
                { id: '99', name: 'AI Core', link: '#', color: '#FFD700', isSpecial: true }
            ],

            init() {
                this.buildSolarSystem();
                this.initSearch();
            },

            buildSolarSystem() {
                const system = document.getElementById('galaxy');
                if (!system) return;

                // Logic: Automatically slice modules into rings
                const rings = [];
                const itemsPerRing = 8; // Max planets per orbit
                let currentRadius = 220; // Starting radius (Adjusted for visual spacing)
                let currentSpeed = 40;   // Starting rotation speed (seconds)

                for (let i = 0; i < this.modules.length; i += itemsPerRing) {
                    // Create a ring for every chunk
                    rings.push({
                        r: currentRadius,
                        speed: currentSpeed,
                        items: this.modules.slice(i, i + itemsPerRing)
                    });

                    // Increment layout
                    currentRadius += 160; // Add distance
                    currentSpeed += 30;   // Slow down
                }

                rings.forEach((ring, idx) => {
                    const orbitContainer = document.createElement('div');
                    Object.assign(orbitContainer.style, {
                        position: 'absolute', top: '50%', left: '50%', width: '0', height: '0',
                        transformStyle: 'preserve-3d',
                        animation: `spin-orbit ${ring.speed}s linear infinite`,
                        pointerEvents: 'none'
                    });
                    // Visible Orbit Line
                    const orbitLine = document.createElement('div');
                    Object.assign(orbitLine.style, {
                        position: 'absolute', top: '50%', left: '50%', transform: 'translate(-50%, -50%)',
                        width: `${ring.r * 2}px`, height: `${ring.r * 2}px`,
                        borderRadius: '50%', border: '1px dashed rgba(255,255,255,0.1)',
                        pointerEvents: 'none'
                    });
                    system.appendChild(orbitLine); // Append line separately so it doesn't rotate? 
                    // Wait, if line rotates, dashes rotate. That's cool.
                    // But if I put line inside container, it rotates.

                    // The Previous Design had .orbit elements.
                    // Let's put the line INSIDE the container? No, container has width 0.
                    // I'll append the container to system.

                    if (idx % 2 !== 0) orbitContainer.style.animationDirection = 'reverse';
                    system.appendChild(orbitContainer);

                    // Add Planets to Container
                    const step = (2 * Math.PI) / ring.items.length;

                    ring.items.forEach((m, i) => {
                        const angle = step * i;
                        const x = Math.cos(angle) * ring.r;
                        const z = Math.sin(angle) * ring.r;

                        const link = document.createElement('a');
                        link.className = 'planet-link';

                        if (m.isSpecial) {
                            link.href = "#"; link.onclick = (e) => { e.preventDefault(); /* App.deployAI(); */ };
                        } else {
                            link.href = m.link;
                        }

                        // Positioning
                        link.style.transform = `translate3d(${x}px, 0, ${z}px) rotateX(0deg)`; // 2D Plane
                        // Note: rotateX(-90deg) was for 3D tilt. This new design looks 2D flat from top?
                        // "Final Design" CSS had no 3D universe container. It was flat.
                        // So I remove rotateX(-90deg).

                        link.innerHTML = `
                            <div class="planet-content" style="animation-duration: ${ring.speed}s; animation-direction: ${idx % 2 !== 0 ? 'normal' : 'reverse'};">
                                <div class="planet-core" style="border-color: ${m.color}; box-shadow: 0 0 15px ${m.color}"></div>
                                <div class="planet-label" style="border-color: ${m.color}">
                                    <span style="color:${m.color}; margin-right:4px;">${m.id}</span> ${m.name}
                                </div>
                            </div>
                        `;
                        orbitContainer.appendChild(link);
                    });
                });
            },

            initSearch() {
                const input = document.getElementById('search-input');
                if (!input) return;
                input.addEventListener('input', (e) => {
                    const val = e.target.value.toLowerCase().trim();
                    const links = document.querySelectorAll('.planet-link');
                    links.forEach(l => {
                        const text = l.innerText.toLowerCase();
                        if (val === "" || text.includes(val)) {
                            l.style.opacity = '1';
                            l.style.filter = 'none';
                        } else {
                            l.style.opacity = '0.1';
                            l.style.filter = 'grayscale(100%)';
                        }
                    });
                });
            }
        };

        document.addEventListener('DOMContentLoaded', () => App.init());
    </script>
</body>

</html>
