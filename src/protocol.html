---
layout: base.njk
title: "AnoHUB Protocol | Central Command"
description: "The central nervous system of AnoHUB operations. Access specific engineering protocols and methodology
modules."
---

<style>
    .universe-container {
        height: 70vh;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        perspective: 1500px;
        overflow: hidden;
        position: relative;
        background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
    }

    #galaxy {
        position: relative;
        width: 0;
        height: 0;
        transform-style: preserve-3d;
        /* Animation spin-orbit defined in global or utility */
        animation: spin-orbit 80s linear infinite;
        pointer-events: none;
    }

    .universe-container:hover #galaxy {
        animation-play-state: paused;
    }

    @keyframes spin-orbit {
        from {
            transform: rotateX(75deg) rotateZ(0deg);
        }

        to {
            transform: rotateX(75deg) rotateZ(360deg);
        }
    }

    .orbit-ring {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 50%;
        transform-style: preserve-3d;
        pointer-events: none;
    }

    .planet-link {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 40px;
        height: 40px;
        margin-left: -20px;
        margin-top: -20px;
        display: flex;
        align-items: center;
        justify-content: center;
        transform-style: preserve-3d;
        cursor: pointer;
        text-decoration: none;
        pointer-events: auto !important;
        z-index: 100;
    }

    .planet-body {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #000;
        border: 2px solid;
        box-shadow: 0 0 15px currentColor;
        transition: all 0.3s ease;
    }

    .planet-label {
        position: absolute;
        top: 24px;
        left: 50%;
        transform: translateX(-50%);
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px;
        font-weight: bold;
        color: #aaa;
        background: rgba(0, 0, 0, 0.8);
        padding: 2px 6px;
        border-radius: 4px;
        border: 1px solid #333;
        white-space: nowrap;
        opacity: 0.6;
        transition: all 0.3s;
        pointer-events: none;
    }

    .planet-link:hover .planet-body {
        transform: scale(2.5);
        background: white;
        box-shadow: 0 0 50px white;
        border-color: white !important;
    }

    .planet-link:hover .planet-label {
        opacity: 1;
        transform: translateX(-50%) scale(1.2);
        border-color: #FFB800;
        color: #FFB800;
        background: black;
        z-index: 200;
    }

    .core-sun {
        position: absolute;
        width: 80px;
        height: 80px;
        background: radial-gradient(circle, #fff 10%, #FFB800 100%);
        border-radius: 50%;
        transform: translate(-50%, -50%);
        box-shadow: 0 0 80px rgba(255, 184, 0, 0.5);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Oswald', sans-serif;
        font-weight: 900;
        color: black;
        font-size: 24px;
        z-index: 50;
        pointer-events: auto;
    }

    .module-card {
        background: rgba(15, 23, 42, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(4px);
        transition: all 0.3s ease;
    }

    .module-card:hover {
        transform: translateY(-5px);
        border-color: var(--hover-color);
        box-shadow: 0 0 30px var(--hover-glow);
    }
</style>

<section class="universe-container pt-20">
    <div id="galaxy">
        <!-- Core Sun -->
        <a href="/" class="core-sun">A</a>

        <!-- Orbit Rings -->
        <div class="orbit-ring w-[350px] h-[350px]"></div>
        <div class="orbit-ring w-[550px] h-[550px]"></div>
        <div class="orbit-ring w-[750px] h-[750px]"></div>
    </div>
</section>

<section class="py-24 px-6 relative z-10">
    <div class="max-w-7xl mx-auto">
        <div class="text-center mb-16">
            <h2 class="text-h-gold font-mono text-xs tracking-widest uppercase mb-4" data-i18n="protocol_page.label">
                Central Index</h2>
            <h1 class="text-4xl md:text-6xl font-black text-white uppercase tracking-tight"
                data-i18n="protocol_page.title">Protocol Matrix</h1>
        </div>

        <div id="modules-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <!-- Injected via JS -->
        </div>
    </div>
</section>

<canvas id="matrix-canvas" class="fixed inset-0 pointer-events-none opacity-20 z-0"></canvas>

<script src="/assets/js/protocol-galaxy.js"></script>
