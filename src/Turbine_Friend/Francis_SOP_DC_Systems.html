<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOP: SOP PROCEDURE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');

        body {
            font-family: 'JetBrains Mono', monospace;
            background-color: #0c0a09; /* Industrial Dark Mode */
            color: #d6d3d1;
        }

        .procedure-card {
            background: #1c1917;
            border: 1px solid #292524;
            padding: 24px;
            margin-bottom: 16px;
            border-left: 4px solid #44403c;
        }

        .procedure-card.critical {
            border-left-color: #dc2626;
            background: #2a1210;
        }

        .step-num {
            color: #3b82f6;
            font-weight: bold;
            margin-right: 8px;
        }

        .btn-return {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #1c1917;
            border: 1px solid #44403c;
            color: #78716c;
            padding: 8px 16px;
            font-size: 12px;
            text-transform: uppercase;
            font-weight: bold;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .btn-return:hover {
            border-color: #3b82f6;
            color: white;
        }
    </style>
</head>

<body class="p-6 md:p-12 max-w-4xl mx-auto">

    <!-- Header -->
    <header class="mb-10 pb-6 border-b border-stone-800 flex justify-between items-start">
        <div>
            <div class="flex items-center gap-2 mb-2">
                <span class="px-2 py-1 rounded bg-blue-900/30 text-blue-400 text-[10px] font-bold border border-blue-900 uppercase">SOP-GEN-00X</span>
                <span class="text-[10px] text-stone-500 uppercase font-bold">REV 3.0</span>
            </div>
            <h1 class="text-3xl font-bold text-white mb-2" data-i18n="title">SOP PROCEDURE</h1>
            <p class="text-stone-500 text-sm" data-i18n="subtitle">Standard Operation Protocol</p>
        </div>
        
        <!-- Standard Return Button -->
        <a href="Francis_Horizontal_Dashboard.html" class="btn-return">
            <i data-lucide="arrow-left" class="w-4 h-4"></i> <span data-i18n="return">Back to Dashboard</span>
        </a>
    </header>

    <!-- Content -->
    <div class="space-y-6">

    </div>

    <!-- Hidden Translation Data -->
    <script>
        lucide.createIcons();

        // Check global lang preference
        const ml = localStorage.getItem('anohub_lang_pref') || 'en';

        const i18n = {
            en: {
                title: "SOP PROCEDURE",
                subtitle: "Standard Operation Protocol",
                return: "Back to Dashboard"
            },
            bs: {
                title: "SOP PROCEDURE",
                subtitle: "Standard Operation Protocol",
                return: "Povratak na Kontrolnu Tablu"
            }
        };

        if(ml === 'bs') {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if(i18n.bs[key]) el.innerText = i18n.bs[key];
            });
        }
    </script>
</body>
</html>
