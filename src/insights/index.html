---
title: "Expert Insights & Intelligence Hub | Anohubs"
---

<section class="text-center px-4 py-16">
    <div
        class="inline-flex items-center gap-2 bg-white/5 border border-white/10 px-6 py-2 rounded-full mb-8 animate-fade-up backdrop-blur-md">
        <div class="w-2 h-2 bg-h-cyan rounded-full animate-pulse"></div>
        <span class="text-[10px] font-mono font-bold text-slate-300 uppercase tracking-widest"
            data-i18n="insights_page.status">Knowledge Base:
            Online</span>
    </div>
    <h1 class="intelligence-title mb-6 animate-fade-up" style="animation-delay: 0.1s;"
        data-i18n="insights_page.main_title">INTELLIGENCE</h1>
    <p class="text-slate-400 text-lg md:text-xl max-w-2xl mx-auto font-light animate-fade-up"
        style="animation-delay: 0.2s;" data-i18n="insights_page.subtitle">
        Forensic engineering insights, strategic forecasts, and the unvarnished truth about asset integrity.
    </p>
</section>

<section id="featured-container" class="max-w-6xl mx-auto px-4 mb-20 animate-fade-up" style="animation-delay: 0.25s;">
</section>

<section class="max-w-6xl mx-auto px-4 -mt-8 mb-16 relative z-20 animate-fade-up" style="animation-delay: 0.3s;">
    <div class="filter-bar rounded-2xl p-4 md:p-6 flex flex-col md:flex-row justify-between items-center gap-6">
        <div
            class="flex flex-wrap justify-center gap-6 md:gap-8 text-[10px] md:text-xs font-bold font-mono uppercase tracking-widest">
            <button class="filter-btn active" onclick="filterInsights('all')" data-i18n="insights_page.filter_all">All
                Briefs</button>
            <button class="filter-btn" onclick="filterInsights('tech')"
                data-i18n="insights_page.filter_tech">Technical</button>
            <button class="filter-btn" onclick="filterInsights('finance')"
                data-i18n="insights_page.filter_fin">Financial</button>
            <button class="filter-btn" onclick="filterInsights('strategy')"
                data-i18n="insights_page.filter_strat">Strategic</button>
        </div>
        <div class="relative w-full md:w-72">
            <a href="/" class="group block">
                <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
            </a>
            <input type="text" id="search-input" placeholder="Search keywords..."
                class="search-input w-full text-xs rounded-full py-3 pl-10 pr-4 transition">
        </div>
    </div>
</section>

<section class="max-w-7xl mx-auto px-6">
    <div id="insights-archive-grid" class="grid md:grid-cols-2 lg:grid-cols-3 gap-8">
    </div>
</section>
