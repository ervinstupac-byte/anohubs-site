---
layout: base.njk
title: "Neural Command Terminal | AnoHUB"
---

<section class="max-w-6xl mx-auto px-4 py-20">
    <div class="mb-12">
        <div
            class="inline-flex items-center gap-2 px-3 py-1 rounded border border-h-red/30 bg-h-red/10 text-h-red text-[10px] font-mono tracking-widest uppercase mb-6 animate-pulse">
            <div class="w-1.5 h-1.5 rounded-full bg-h-red"></div>
            <span>SECURE ACCESS // LEVEL 1 ADMIN</span>
        </div>
        <h1 class="text-4xl font-black text-white mb-4">Neural Command Terminal</h1>
        <p class="text-slate-400 font-mono text-sm">AUTHORIZED PERSONNEL ONLY // DATA WRITE ACCESS</p>
    </div>

    <!-- 1. GRID SYNC -->
    <div class="glass-panel p-8 mb-12 border-l-4 border-h-gold bg-black/40 backdrop-blur border border-white/5">
        <h2 class="text-2xl font-bold text-white mb-6 flex items-center gap-3">
            <i data-lucide="zap" class="text-h-gold"></i> Grid Frequency Synchronization
        </h2>
        <div class="flex gap-4 items-center">
            <input type="number" id="freq-input" step="0.01"
                class="bg-black/50 border border-slate-700 p-4 text-white w-48 focus:border-h-gold outline-none">
            <button id="btn-sync"
                class="bg-h-gold text-black px-8 py-4 font-black hover:bg-white transition-all uppercase tracking-widest text-sm">SYNC_NETWORK</button>
        </div>
        <p id="grid-status" class="mt-4 font-mono text-xs text-slate-500"></p>
    </div>

    <!-- 2. MISSION LOG -->
    <div class="glass-panel p-8 mb-12 border-l-4 border-h-green bg-black/40 backdrop-blur border border-white/5">
        <h2 class="text-2xl font-bold text-white mb-6 flex items-center gap-3">
            <i data-lucide="shield-check" class="text-h-green"></i> Log New Mission
        </h2>
        <form id="mission-form" class="grid grid-cols-2 gap-4">
            <div class="space-y-1">
                <label class="text-[10px] uppercase font-mono text-slate-500">Case ID</label>
                <input type="text" id="m-id" placeholder="e.g. CS-99"
                    class="w-full bg-black/50 border border-slate-700 p-4 text-white focus:border-h-green outline-none">
            </div>
            <div class="space-y-1">
                <label class="text-[10px] uppercase font-mono text-slate-500">Turbine Type</label>
                <input type="text" id="m-type" placeholder="FRANCIS / KAPLAN / PELTON"
                    class="w-full bg-black/50 border border-slate-700 p-4 text-white focus:border-h-green outline-none">
            </div>
            <div class="col-span-2 space-y-1">
                <label class="text-[10px] uppercase font-mono text-slate-500">Mission Title</label>
                <input type="text" id="m-title" placeholder="THE PATHOLOGY OF SURGE"
                    class="w-full bg-black/50 border border-slate-700 p-4 text-white focus:border-h-green outline-none">
            </div>
            <div class="col-span-2 space-y-1">
                <label class="text-[10px] uppercase font-mono text-slate-500">Threat Reality</label>
                <textarea id="m-threat" placeholder="RESONANCE EVENT AT 4.2Hz..."
                    class="w-full bg-black/50 border border-slate-700 p-4 text-white focus:border-h-green outline-none h-32"></textarea>
            </div>
            <div class="col-span-2 space-y-1">
                <label class="text-[10px] uppercase font-mono text-slate-500">Immunity Result</label>
                <textarea id="m-result" placeholder="NEUTRALIZED VIA ALIGNMENT PROTOCOLED..."
                    class="w-full bg-black/50 border border-slate-700 p-4 text-white focus:border-h-green outline-none h-32"></textarea>
            </div>
            <button type="submit"
                class="col-span-2 bg-h-green text-black px-8 py-4 font-black hover:bg-white transition-all uppercase tracking-widest text-sm">COMMIT_TO_DATABASE</button>
        </form>
    </div>

    <!-- 3. INBOX -->
    <div class="glass-panel p-8 border-l-4 border-h-cyan bg-black/40 backdrop-blur border border-white/5">
        <h2 class="text-2xl font-bold text-white mb-6 flex items-center gap-3">
            <i data-lucide="inbox" class="text-h-cyan"></i> Recent Inquiries
        </h2>
        <div id="inbox-list" class="font-mono text-xs space-y-4">
            <div class="animate-pulse text-slate-500">WAITING_FOR_SECURE_UPLINK...</div>
        </div>
    </div>
</section>

<script type="module">
    import { supabase } from '/assets/js/db.js';

    // --- 1. GRID LOGIC ---
    const freqInput = document.getElementById('freq-input');
    const btnSync = document.getElementById('btn-sync');
    const gridStatus = document.getElementById('grid-status');

    async function loadGrid() {
        const { data } = await supabase.from('system_status').select('*').eq('id', 'main_grid').single();
        if (data) {
            freqInput.value = data.frequency;
            gridStatus.innerText = `CURRENT_DB_VAL: ${data.frequency} Hz`;
        }
    }

    btnSync.addEventListener('click', async () => {
        btnSync.innerText = 'SYNCING...';
        const val = parseFloat(freqInput.value);
        const { error } = await supabase.from('system_status').update({ frequency: val }).eq('id', 'main_grid');

        if (!error) {
            btnSync.innerText = 'SYNC_COMPLETE';
            gridStatus.innerText = `UPDATED: ${val} Hz`;
            setTimeout(() => btnSync.innerText = 'SYNC_NETWORK', 2000);
        } else {
            alert('ERROR: ' + error.message);
        }
    });

    // --- 2. MISSION LOGIC ---
    document.getElementById('mission-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const { error } = await supabase.from('missions').insert([{
            case_id: document.getElementById('m-id').value,
            turbine_type: document.getElementById('m-type').value,
            title: document.getElementById('m-title').value,
            threat: document.getElementById('m-threat').value,
            result: document.getElementById('m-result').value
        }]);

        if (!error) {
            alert('MISSION LOGGED SUCCESSFULLY');
            e.target.reset();
        } else {
            alert('WRITE ERROR: ' + error.message);
        }
    });

    // --- 3. INBOX LOGIC ---
    async function loadInbox() {
        const { data, error } = await supabase.from('inquiries').select('*').order('created_at', { ascending: false }).limit(10);
        const list = document.getElementById('inbox-list');
        list.innerHTML = '';

        if (data) {
            data.forEach(msg => {
                list.innerHTML += `
                <div class="border-b border-white/5 pb-4 mb-4 last:border-0 hover:bg-white/5 p-2 transition">
                    <div class="flex justify-between items-start mb-1">
                        <span class="text-white font-bold font-mono">[${new Date(msg.created_at).toLocaleDateString()}]</span>
                        <span class="text-h-gold text-[10px] font-mono">${msg.email}</span>
                    </div>
                    <div class="mb-2">
                        <span class="text-h-cyan font-bold">${msg.full_name}</span> 
                        <span class="text-slate-500 font-mono text-[10px]">(${msg.company})</span>
                    </div>
                    <div class="text-slate-400 text-sm italic">"${msg.message_body || msg.message}"</div>
                </div>
                `;
            });
        }
    }

    // INIT
    loadGrid();
    loadInbox();
</script>
