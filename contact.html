<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Strategic Contact | AnoHUB Command</title>
    <meta name="description" content="Initiate a secure transmission to AnoHUB engineering command.">

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;900&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="assets/css/preloader.css">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
                    colors: {
                        'h-gold': '#FFD700', 'h-dark': '#020617', 'h-red': '#ef4444', 'h-green': '#10b981'
                    },
                    animation: { 'pulse-fast': 'pulse 1s cubic-bezier(0.4, 0, 0.6, 1) infinite' }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #020617;
            color: #e2e8f0;
            overflow-x: hidden;
        }

        /* === GLAVNA FIKSNA POZADINA CIJELE STRANICE === */
        #bg-fixed {
            position: fixed;
            inset: 0;
            z-index: -3;
            /* VAŠA SLIKA SE SADA KORISTI OVDJE ZA CIJELU STRANICU */
            background-image: url('assets/images/Bujrum.jpg');
            background-size: cover;
            background-position: center;
            /* Dodan blagi tamni filter da tekst bude čitljiviji */
            filter: brightness(0.6) contrast(1.1);
        }

        /* === STILOVI ZA SADRŽAJ === */
        /* Uklonjena specifična pozadina za ovu sekciju jer je sada cijela stranica ta slika */
        #bujrum-section {
            position: relative;
            padding: 4rem 1rem;
            /* Dodan padding za bolji razmak */
        }

        /* Blago prozirni paneli da se slika nazire ispod */
        .glass-panel {
            background: rgba(10, 10, 20, 0.85);
            /* Malo tamniji panel za bolji kontrast */
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 215, 0, 0.15);
            /* Suptilni zlatni rub */
        }

        /* INPUT STYLE */
        .tech-input {
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid #334155;
            color: #fff;
            font-family: 'JetBrains Mono', monospace;
            transition: all 0.2s;
        }

        .tech-input:focus {
            border-color: #FFD700;
            outline: none;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.2);
        }
    </style>

    <!-- Favicons -->
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png">
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
    <link rel="manifest" href="assets/site.webmanifest">
</head>

<body class="antialiased">
    <noscript>
        <div style="border: 1px solid #ef4444; padding: 20px;">
            <h1 style="color: #ef4444; font-size: 24px; margin-bottom: 10px;">SYSTEM ERROR: SCRIPT BLOCKED</h1>
            <p>The AnoHUB Protocol requires JavaScript to function.<br>Please enable scripts to access the interface.
            </p>
        </div>
    </noscript>


    <div id="bg-fixed"></div>

    <div id="global-header"></div>

    <main class="relative z-10 w-full h-screen flex flex-col justify-center items-center px-4 pt-20">

        <div
            class="w-full max-w-5xl bg-black/60 backdrop-blur-xl border border-white/10 p-8 md:p-12 shadow-[0_0_50px_rgba(0,0,0,0.5)] flex flex-col md:flex-row gap-12 items-start">

            <div class="w-full md:w-1/3 space-y-8">
                <div>
                    <h1 class="text-4xl md:text-5xl font-black text-white mb-2 font-header">
                        <span class="text-h-gold" data-i18n="contact_page.header.initiate">INITIATE</span><br>
                        <span data-i18n="contact_page.header.protocol">PROTOCOL</span>
                    </h1>
                    <p class="text-slate-400 text-sm italic border-l-2 border-h-red pl-2"
                        data-i18n="contact_page.header.warning">
                        WARNING: We are not a sales team. We are an engineering authority. Protocol initiation requires
                        a verified technical anomaly.
                    </p>
                </div>

                <div class="space-y-4 font-mono text-sm">
                    <a href="mailto:info@anohubs.com"
                        class="flex items-center gap-4 text-slate-300 hover:text-white transition-colors group">
                        <div
                            class="w-8 h-8 rounded-full bg-white/5 flex items-center justify-center text-h-cyan group-hover:bg-h-cyan/20 transition-colors">
                            <i data-lucide="mail"></i></div>
                        <span>info@anohubs.com</span>
                    </a>

                    <a href="tel:+436601234567"
                        class="flex items-center gap-4 text-slate-300 hover:text-white transition-colors group">
                        <div
                            class="w-8 h-8 rounded-full bg-white/5 flex items-center justify-center text-h-gold group-hover:bg-h-gold/20 transition-colors">
                            <i data-lucide="phone"></i></div>
                        <span>+43 (0) 660 123 4567</span>
                    </a>

                    <a href="https://www.google.com/maps/search/Sarajevo" target="_blank" rel="noopener noreferrer"
                        class="flex items-center gap-4 text-slate-300 hover:text-white transition-colors group">
                        <div
                            class="w-8 h-8 rounded-full bg-white/5 flex items-center justify-center text-h-green group-hover:bg-h-green/20 transition-colors">
                            <i data-lucide="map-pin"></i></div>
                        <span data-i18n="contact_page.info.location">Sarajevo (HQ) / Vienna (EU Base)</span>
                    </a>
                </div>
            </div>
            <div class="w-full md:w-2/3">
                <form id="contactForm" action="https://formspree.io/f/xqaywlaq" method="POST" class="space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="space-y-1">
                            <label for="full_name" class="text-[10px] uppercase tracking-widest text-slate-500"
                                data-i18n="contact_page.form.label_identity">Identity</label>
                            <input type="text" id="full_name" name="full_name" placeholder="Full Name"
                                data-i18n="contact_page.form.ph_name"
                                class="w-full bg-white/5 border border-white/10 p-3 text-white focus:border-h-gold focus:outline-none transition-colors text-sm">
                        </div>
                        <div class="space-y-1">
                            <label for="company_name" class="text-[10px] uppercase tracking-widest text-slate-500"
                                data-i18n="contact_page.form.label_org">Organization</label>
                            <input type="text" id="company_name" name="company_name" placeholder="Company Name"
                                data-i18n="contact_page.form.ph_company"
                                class="w-full bg-white/5 border border-white/10 p-3 text-white focus:border-h-gold focus:outline-none transition-colors text-sm">
                        </div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="space-y-1">
                            <label for="email_addr" class="text-[10px] uppercase tracking-widest text-slate-500"
                                data-i18n="contact_page.form.label_comms">Comms</label>
                            <input type="email" id="email_addr" name="email_addr" placeholder="Email Address"
                                data-i18n="contact_page.form.ph_email"
                                class="w-full bg-white/5 border border-white/10 p-3 text-white focus:border-h-cyan focus:outline-none transition-colors text-sm">
                        </div>
                        <div class="space-y-1">
                            <label for="phone_num" class="text-[10px] uppercase tracking-widest text-slate-500"
                                data-i18n="contact_page.form.label_phone">Direct Line</label>
                            <input type="tel" id="phone_num" name="phone_num" placeholder="+387..."
                                data-i18n="contact_page.form.ph_phone"
                                class="w-full bg-white/5 border border-white/10 p-3 text-white focus:border-h-cyan focus:outline-none transition-colors text-sm">
                        </div>
                    </div>
                    <div class="space-y-1">
                        <label for="message_body" class="text-[10px] uppercase tracking-widest text-slate-500"
                            data-i18n="contact_page.form.label_briefing">Briefing</label>
                        <textarea id="message_body" name="message_body" rows="3"
                            placeholder="Describe the mechanical anomaly..." data-i18n="contact_page.form.ph_message"
                            class="w-full bg-white/5 border border-white/10 p-3 text-white focus:border-h-red focus:outline-none transition-colors text-sm resize-none"></textarea>
                    </div>
                    <button type="submit"
                        class="group w-full bg-h-gold hover:bg-white text-black font-bold py-3 px-6 transition-all flex items-center justify-center gap-2">
                        <span data-i18n="contact_page.form.btn_transmit">TRANSMIT DATA</span>
                        <i data-lucide="arrow-right" class="w-4 h-4 group-hover:translate-x-1 transition-transform"></i>
                    </button>
                    <p id="formMessage" class="mt-4 text-center text-xs font-mono hidden"></p>
                </form>
            </div>
        </div>
    </main>

    <script src="assets/js/translations.js"></script>
    <script>
        lucide.createIcons();

        // MOBILE MENU
        const menuBtn = document.getElementById('mobile-menu-btn');
        const mobileMenu = document.getElementById('mobile-menu');
        const mobileLinks = document.querySelectorAll('.mobile-link');

        if (menuBtn) {
            menuBtn.addEventListener('click', () => {
                mobileMenu.classList.toggle('translate-x-full');
                document.body.style.overflow = mobileMenu.classList.contains('translate-x-full') ? 'auto' : 'hidden';
            });
            mobileLinks.forEach(l => l.addEventListener('click', () => {
                mobileMenu.classList.add('translate-x-full');
                document.body.style.overflow = 'auto';
            }));
        }
    </script>

    <!-- Component Loader -->
    <script src="assets/js/layout-loader.js"></script>

    <!-- Supabase Integration -->
    <script type="module">
        import { submitInquiry } from './assets/js/db.js';

        // Listen for language changes to update script logic if needed
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.querySelector('form');
            const btn = form.querySelector('button');

            btn.addEventListener('click', async (e) => {
                e.preventDefault();

                // Fetch dynamic Text
                const lang = localStorage.getItem('anohub_lang') || 'en';
                const isEn = lang === 'en';
                const txtEncrypt = isEn ? 'ENCRYPTING...' : 'ŠIFRIRANJE...';
                const txtSent = isEn ? 'DATA TRANSMITTED' : 'PODACI PRENESENI';
                const txtError = isEn ? 'Error: ' : 'Greška: ';

                // Original Text (Restored from i18n attribute implicitly by page update or hardcoded override)
                // We use the span inside
                const span = btn.querySelector('span');
                const originalText = span.innerText;

                span.innerText = txtEncrypt;
                span.classList.add('animate-pulse', 'tracking-widest');

                btn.classList.remove('bg-h-gold');
                btn.classList.add('bg-slate-600');

                const formData = {
                    name: form.querySelector('#full_name').value,
                    company: form.querySelector('#company_name').value,
                    email: form.querySelector('#email_addr').value,
                    phone: form.querySelector('#phone_num').value,
                    message: form.querySelector('#message_body').value
                };
                const result = await submitInquiry(formData);
                if (result.success) {
                    btn.classList.remove('bg-slate-600');
                    btn.classList.add('bg-h-green', 'text-white');
                    btn.innerHTML = `${txtSent} <i data-lucide="check" class="inline ml-2"></i>`;
                    form.reset();
                    if (window.lucide) lucide.createIcons();
                    setTimeout(() => {
                        // Restore logic
                        btn.innerHTML = `<span data-i18n="contact_page.form.btn_transmit">${originalText}</span> <i data-lucide="arrow-right" class="w-4 h-4 group-hover:translate-x-1 transition-transform"></i>`;
                        btn.classList.remove('bg-h-green', 'text-white');
                        btn.classList.add('bg-h-gold');
                        if (window.lucide) lucide.createIcons();
                        // Trigger translation update to ensure correct language is back if switched
                        if (window.changeLanguage) window.changeLanguage(lang);
                    }, 4000);
                } else {
                    alert(txtError + result.msg);
                    btn.innerHTML = `<span data-i18n="contact_page.form.btn_transmit">${originalText}</span> <i data-lucide="arrow-right" class="w-4 h-4 group-hover:translate-x-1 transition-transform"></i>`;
                    btn.classList.remove('bg-slate-600');
                    btn.classList.add('bg-h-gold');
                    if (window.lucide) lucide.createIcons();
                }
            });
        });
    </script>
</body>

</html>
